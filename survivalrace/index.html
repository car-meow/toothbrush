			if (nexusOverlay) {
				var bgUrl = 'loading_screen.png';

					bgUrl = base.substring(0, base.lastIndexOf('/') + 1) + 'loading_screen.png';
				} catch(e) {}
				nexusOverlay.style.backgroundImage = "url('" + bgUrl + "')";
			}
			nexusFlashTimer = setTimeout(function() {
				if (!isNexusDone && nexusBar) {
					nexusBar.classList.add('nexus-bar-flashing');
				}
			}, 3000);
		}

		window.updateNexusProgress = function(pct) {
			if (isNexusDone || !nexusBar) return;
			nexusProgress = Math.max(nexusProgress, Math.min(100, Math.round(pct)));
			nexusBar.style.width = nexusProgress + '%';
		};

		window.completeNexusLoading = function() {
			if (isNexusDone) return;
			isNexusDone = true;
			if (nexusFlashTimer) clearTimeout(nexusFlashTimer);
			if (nexusBar) nexusBar.style.width = '100%';

			if (nexusOverlay) {
				nexusOverlay.style.opacity = '0';
				nexusOverlay.style.pointerEvents = 'none';
				setTimeout(function() {
					if (nexusOverlay && nexusOverlay.parentNode) {
						nexusOverlay.parentNode.removeChild(nexusOverlay);
					}
					nexusOverlay = null;
					nexusBar = null;
				}, 500);
			}
		};

		// Fail-safe in case Unity init hook is delayed
		setTimeout(function() {
			if (!isNexusDone) window.completeNexusLoading();
		}, 12000);
