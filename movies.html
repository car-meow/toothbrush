<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Stream Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0914;
      --card-bg: #151124;
      --accent: #8b5cf6;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      max-width: 500px;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button.search-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #1e1a33;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-type {
      font-size: 12px;
      color: #a78bfa;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Video Player Modal */
    #player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .player-container {
      width: 90%;
      max-width: 1000px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--card-bg);
    }

    video {
      width: 100%;
      height: 560px;
      display: block;
      background: #000;
      outline: none;
    }

    .close-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #status-msg {
      text-align: center;
      font-size: 16px;
      color: var(--accent);
      margin: 20px 0;
      display: none;
    }
  </style>
</head>
<body>

  <div class="search-bar">
    <input type="text" id="query" placeholder="Search movies or shows..." onkeydown="if(event.key==='Enter') searchMedia()">
    <button class="search-btn" onclick="searchMedia()">Search</button>
  </div>

  <div id="status-msg">Searching stream APIs...</div>
  <div class="grid" id="results-grid"></div>

  <!-- NATIVE HTML5 VIDEO PLAYER -->
  <div id="player-modal">
    <div class="player-container">
      <div class="player-top">
        <span id="player-title" style="font-weight: bold;">Loading Stream...</span>
        <button class="close-btn" onclick="closePlayer()">✕ Close</button>
      </div>
      <video id="native-player" controls autoplay playsinline></video>
    </div>
  </div>

  <script>
    // Multiple active scraper instances + CORS bypass relays
    const API_INSTANCES = [
      "https://api.consumet.org/movies/flixhq",
      "https://consumet-api-production-d05a.up.railway.app/movies/flixhq",
      "https://consumet.herokuapp.com/movies/flixhq",
      "https://api-consumet.vercel.app/movies/flixhq"
    ];

    const CORS_PROXIES = [
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      (url) => url // Direct attempt
    ];

    let hlsInstance = null;

    // Helper: Tries multiple endpoints and proxies until one responds
    async function robustFetch(path) {
      for (const instance of API_INSTANCES) {
        const fullUrl = `${instance}${path}`;
        for (const makeProxyUrl of CORS_PROXIES) {
          try {
            const target = makeProxyUrl(fullUrl);
            const res = await fetch(target, { headers: { 'Accept': 'application/json' } });
            if (res.ok) {
              const data = await res.json();
              if (data) return data;
            }
          } catch (e) {
            // Silently try next proxy/instance
          }
        }
      }
      throw new Error("All stream mirror endpoints are currently unreachable.");
    }

    // 1. Search Functionality
    async function searchMedia() {
      const query = document.getElementById('query').value.trim();
      if (!query) return;

      const status = document.getElementById('status-msg');
      const grid = document.getElementById('results-grid');
      
      status.style.display = 'block';
      status.textContent = `Searching for "${query}" across streaming mirrors...`;
      grid.innerHTML = '';

      try {
        const data = await robustFetch(`/${encodeURIComponent(query)}`);
        status.style.display = 'none';

        if (!data.results || data.results.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center;">No results found. Try another search.</div>';
          return;
        }

        renderGrid(data.results);
      } catch (err) {
        status.style.display = 'block';
        status.textContent = "Could not connect to external mirrors. Using offline backup catalog.";
        // Auto-fallback so UI is never blank
        renderGrid([
          { id: "movie/watch-deadpool-wolverine-111160", title: "Deadpool & Wolverine", image: "https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg", type: "Movie" },
          { id: "movie/watch-dune-part-two-106518", title: "Dune: Part Two", image: "https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg", type: "Movie" },
          { id: "movie/watch-inside-out-2-106520", title: "Inside Out 2", image: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg", type: "Movie" }
        ]);
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('results-grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => loadDirectStream(item.id, item.title);
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" loading="lazy"/>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-type">${item.type ? item.type : 'Movie'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 2. Resolve Stream & Play in Native Video
    async function loadDirectStream(mediaId, title) {
      document.getElementById('player-title').textContent = `Resolving stream for: ${title}...`;
      document.getElementById('player-modal').style.display = 'flex';
      const video = document.getElementById('native-player');

      try {
        // Step A: Fetch Info
        const infoData = await robustFetch(`/info?id=${encodeURIComponent(mediaId)}`);
        
        let episodeId = "";
        if (infoData.episodes && infoData.episodes.length > 0) {
          episodeId = infoData.episodes[0].id;
        } else {
          throw new Error("No episodes or movie stream IDs found.");
        }

        // Step B: Fetch Stream Sources (.m3u8)
        const streamData = await robustFetch(`/watch?episodeId=${encodeURIComponent(episodeId)}&mediaId=${encodeURIComponent(mediaId)}`);
        const source = streamData.sources.find(s => s.quality === 'auto') || streamData.sources[0];

        if (!source || !source.url) throw new Error("No raw stream URL returned.");

        document.getElementById('player-title').textContent = title;

        // Step C: Play in Hls.js
        if (Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls();
          hlsInstance.loadSource(source.url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = source.url;
          video.play();
        }
      } catch (err) {
        alert("Notice: Direct stream resolution failed (" + err.message + ").");
        closePlayer();
      }
    }

    function closePlayer() {
      const video = document.getElementById('native-player');
      video.pause();
      video.src = '';
      if (hlsInstance) hlsInstance.destroy();
      document.getElementById('player-modal').style.display = 'none';
    }

    // Initial search
    document.getElementById('query').value = "Avengers";
    searchMedia();
  </script>
</body>
</html>
