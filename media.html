    <script>
        (function() {
            try {
                const storage = window.nexusStorage || window.localStorage;
                if (storage.getItem('tb_performance_mode') === 'true') {
                    document.documentElement.classList.add('performance-mode');
                }
            } catch(e) {}
        })();

    <style>
        body.media-bg {
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }

        .media-sticky-stack {
            position: sticky;
            top: 0;
            z-index: 250;
            background: var(--panel-bg-alt);
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        .media-sticky-stack header { position: relative; margin: 0; border-bottom: none; }
        .media-header-warning { position: absolute; left: 50%; transform: translateX(-50%); color: #ff3b30; font-size: 14px; font-weight: 800; white-space: nowrap; text-align: center; pointer-events: none; }
        @media (max-width: 720px) { .media-header-warning { position: static; transform: none; width: 100%; padding: 0 12px 8px; box-sizing: border-box; white-space: normal; } }

        .media-search-row {
            padding: 10px 20px 14px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.12) 0%, transparent 100%);
        }

        .media-container { padding: 16px 24px 48px; max-width: 1680px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .search-area { display: flex; justify-content: center; width: 100%; max-width: 720px; margin: 0 auto; }

        .media-search {
            width: 100%; max-width: 640px; padding: 15px 25px; font-size: 18px; border-radius: 30px;
            border: 2px solid #9C27B0; background: rgba(26, 26, 26, 0.92); color: #fff; outline: none;
            backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: border-color 0.3s;
        }
        .media-search:focus { border-color: #D083DE; }

        .media-section { margin-bottom: 36px; content-visibility: auto; contain-intrinsic-size: 1px 280px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-right: 8px; flex-wrap: wrap; gap: 8px; }
        .section-title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); padding-left: 10px; border-left: 4px solid #9C27B0; }
        
        .media-row { display: flex; gap: 16px; padding: 16px 0 8px; flex-wrap: wrap; align-items: stretch; justify-content: center; }

        .media-card {
            flex: 0 0 auto; width: 160px; height: 240px; position: relative; border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            background: #1a1a1a; box-shadow: 0 4px 10px rgba(0,0,0,0.3); contain: layout paint;
        }

        .poster-img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.4s; display: block; }
        .poster-img.is-fallback { padding: 14px; object-fit: contain; background: linear-gradient(145deg, #202020, #343434); }
        .media-card:hover { transform: scale(1.06); z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .media-card:hover .poster-img { filter: brightness(0.4) blur(4px); }

        .media-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            opacity: 0; transition: opacity 0.3s; padding: 12px; text-align: center; color: #fff; 
            z-index: 2; pointer-events: none;
        }
        .media-card:hover .media-overlay { opacity: 1; }

        .media-date { position: absolute; top: 12px; left: 0; width: 100%; font-size: 11px; font-weight: bold; opacity: 0.9; margin: 0; }
        .media-title { position: absolute; bottom: 12px; left: 0; width: 100%; font-weight: bold; font-size: 13px; line-height: 1.2; padding: 0 8px; box-sizing: border-box; margin: 0; }
        .play-icon { width: 55px; height: 55px; margin: 0; filter: drop-shadow(0 0 10px rgba(156, 39, 176, 0.8)); }

        .fav-btn {
            position: absolute; top: 8px; right: 8px; z-index: 5; font-size: 24px; color: rgba(255, 255, 255, 0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: all 0.2s; pointer-events: auto; line-height: 1;
        }
        .fav-btn:hover { transform: scale(1.2); color: rgba(255, 255, 255, 0.8); }
        .fav-btn.active { color: #FFD700 !important; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6) !important; opacity: 1 !important; }

        .show-all-btn {
            flex: 0 0 auto; width: 160px; min-height: 240px; height: auto; align-self: stretch; background: rgba(90, 90, 96, 0.34);
            border: 2px dashed #6e6e75; border-radius: 12px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.3s; gap: 8px; text-align: center; padding: 12px; box-sizing: border-box;
        }
        .show-all-btn:hover { background: rgba(115, 115, 122, 0.54); transform: scale(1.03); }

        #grid-panel { display: none; width: 100%; }
        #grid-panel.active { display: block; }
        .grid-view-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; padding: 4px 4px 0; }
        .grid-view-title { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 2px 2px 6px rgba(0,0,0,0.55); border-left: 4px solid #9C27B0; padding-left: 12px; }
        .grid-meta { font-size: 13px; color: #bbb; font-weight: 600; }
        
        .grid-view { display: grid; width: 100%; box-sizing: border-box; grid-template-columns: repeat(auto-fill, 160px); justify-content: center; gap: 18px 16px; padding: 8px 0 32px; align-items: start; }
        .grid-view .media-card { width: 100%; aspect-ratio: 2 / 3; height: auto; }

        .loading-spinner { display: inline-block; width: 50px; height: 50px; border: 3px solid rgba(156, 39, 176, 0.3); border-radius: 50%; border-top-color: #9C27B0; animation: spin 1s ease-in-out infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-wrap { grid-column: 1 / -1; width: 100%; display: flex; justify-content: center; padding: 48px 0; }
        
        .back-btn { margin-bottom: 16px; color: #d8d8d8; cursor: pointer; font-weight: bold; display: none !important; align-items: center; gap: 8px; font-size: 15px; user-select: none; }
        .back-btn.visible { display: inline-flex !important; }
        .back-icon { width: 22px; height: 22px; display: block; }
        .media-home-back { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background-color: #3d3d3d; border: none; }
        .media-home-back img { width: 22px; height: 22px; display: block; }
        .search-hint { text-align: center; font-size: 12px; color: #888; margin-top: 4px; margin-bottom: 16px; }

        #search-results-view { display: none; }
        #search-results-view .media-section { animation: searchFadeUp 0.4s ease both; }
        #search-results-view .media-section:nth-child(2) { animation-delay: 0.15s; }
        @keyframes searchFadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    </style>
</head>

    <script>
        const localStorage = window.nexusStorage;
        const TMDB_API_KEY = '1a7373301961d03f97f853a876dd1212';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        // --- FAVORITES LOGIC ---
        function getFavorites() {
            return JSON.parse(localStorage.getItem('tb_favs') || '[]');
        }

        function toggleFavorite(e, item) {
            e.stopPropagation();
            let favs = getFavorites();
            const index = favs.findIndex(f => String(f.id) === String(item.id));

            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.push(item);
            }
            
            localStorage.setItem('tb_favs', JSON.stringify(favs));
            renderFavoritesRow();

            document.querySelectorAll(`.media-card[data-id="${item.id}"] .fav-btn`).forEach(btn => {
                btn.classList.toggle('active', index === -1);
            });
        }

        function renderFavoritesRow() {
            const favs = getFavorites();
            const sec = document.getElementById('favorites-section');
            const row = document.getElementById('row-favorites');
            row.innerHTML = '';
            
            if (favs.length === 0) {
                sec.style.display = 'none';
                return;
            }
            
            sec.style.display = 'block';
            favs.forEach(item => {
                const c = createCard(item);
                if (c) row.appendChild(c);
            });
        }

        // --- TMDB API LOGIC ---
        function buildTMDBUrl(endpoint, extraParams) {
            const q = endpoint.indexOf('?');
            const path = q === -1 ? endpoint : endpoint.slice(0, q);
            const params = new URLSearchParams(q === -1 ? '' : endpoint.slice(q + 1));
            params.set('api_key', TMDB_API_KEY);
            if (extraParams) {
                Object.keys(extraParams).forEach((k) => {
                    if (extraParams[k] !== undefined && extraParams[k] !== null) params.set(k, String(extraParams[k]));
                });
            }
            return 'https://api.themoviedb.org/3/' + path + '?' + params.toString();
        }

        async function fetchTMDB(endpoint, extraParams) {
            const response = await fetch(buildTMDBUrl(endpoint, extraParams));
            if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
            return response.json();
        }

        function inferMediaType(item) {
            if (item.media_type === 'movie' || item.media_type === 'tv' || item.media_type === 'person') return item.media_type;
            if (item.title) return 'movie';
            if (item.name) return 'tv';
            return 'unknown';
        }

        function dedupeResults(list) {
            const seen = new Set();
            return list.filter((item) => {
                const t = inferMediaType(item);
                if (t !== 'movie' && t !== 'tv') return false;
                const key = t + ':' + item.id;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function posterFallbackDataUrl(title) {
            const safeTitle = escapeHtml(title || 'No Poster');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750">
                <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#242424"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient></defs>
                <rect width="500" height="750" fill="url(#g)"/>
                <rect x="34" y="34" width="432" height="682" rx="22" fill="none" stroke="#777" stroke-width="4" opacity=".55"/>
                <text x="250" y="340" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Nexus</text>
                <text x="250" y="392" text-anchor="middle" fill="#cfcfcf" font-family="Arial, sans-serif" font-size="24">Poster unavailable</text>
                <text x="250" y="456" text-anchor="middle" fill="#e7e7e7" font-family="Arial, sans-serif" font-size="24">${safeTitle.slice(0, 28)}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        function getPosterSources(item, title) {
            if (!item.poster_path) return [posterFallbackDataUrl(title)];
            return [
                'https://image.tmdb.org/t/p/w500' + item.poster_path,
                'https://image.tmdb.org/t/p/w780' + item.poster_path,
                'https://image.tmdb.org/t/p/original' + item.poster_path,
                posterFallbackDataUrl(title)
            ];
        }

        function wirePosterFallback(img, sources) {
            img.dataset.posterIndex = '0';
            img.onerror = () => {
                const nextIndex = Number(img.dataset.posterIndex || '0') + 1;
                if (nextIndex >= sources.length) return;
                img.dataset.posterIndex = String(nextIndex);
                if (sources[nextIndex].startsWith('data:')) img.classList.add('is-fallback');
                img.src = sources[nextIndex];
            };
        }

        function createCard(item) {
            const mediaType = inferMediaType(item);
            if (mediaType !== 'movie' && mediaType !== 'tv') return null;

            const card = document.createElement('div');
            card.className = 'media-card';
            card.setAttribute('data-id', item.id);
            
            const title = item.title || item.name || 'Untitled';
            const date = item.release_date || item.first_air_date || '';
            const year = (date && date.split('-')[0]) || 'â€”';
            const posterSources = getPosterSources(item, title);
            
            const isFav = getFavorites().some(f => String(f.id) === String(item.id));

            card.innerHTML = `
                <div class="fav-btn ${isFav ? 'active' : ''}" title="Toggle Favorite">â˜…</div>
                <img src="${posterSources[0]}" class="poster-img${posterSources[0].startsWith('data:') ? ' is-fallback' : ''}" alt="${escapeHtml(title)}" loading="lazy" decoding="async">
                <div class="media-overlay">
                    <div class="media-date">${year}</div>
                    <img src="Assets/mediaP.png" class="play-icon" alt="Play">
                    <div class="media-title">${escapeHtml(title)}</div>
                </div>
            `;
            
            wirePosterFallback(card.querySelector('.poster-img'), posterSources);
            card.querySelector('.fav-btn').onclick = (e) => toggleFavorite(e, item);
            card.onclick = () => openPlayer(item, mediaType);
            return card;
        }

        function createShowAllBtn(endpoint, title) {
            const btn = document.createElement('div');
            btn.className = 'show-all-btn';
            btn.innerHTML = '<span style="font-size:28px;line-height:1;">+</span><span>Show All</span>';
            btn.setAttribute('role', 'button');
            btn.tabIndex = 0;
            btn.onclick = () => showGrid(endpoint, title);
            btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showGrid(endpoint, title); } };
            return btn;
        }

        const BROWSE_SECTIONS = [
            { id: 'row-trending-week', title: 'Trending This Week', endpoint: 'trending/all/week', preview: 6 },
            { id: 'row-trending-day', title: 'Trending Today', endpoint: 'trending/all/day', preview: 6 },
            { id: 'row-popular-movies', title: 'Popular Movies', endpoint: 'movie/popular', preview: 6 },
            { id: 'row-top-rated-movies', title: 'Top Rated Movies', endpoint: 'movie/top_rated', preview: 6 },
            { id: 'row-now-playing', title: 'Now Playing (Theaters)', endpoint: 'movie/now_playing', preview: 6 },
            { id: 'row-upcoming', title: 'Upcoming Movies', endpoint: 'movie/upcoming', preview: 6 },
            { id: 'row-popular-tv', title: 'Popular TV', endpoint: 'tv/popular', preview: 6 },
            { id: 'row-top-tv', title: 'Top Rated TV', endpoint: 'tv/top_rated', preview: 6 },
            { id: 'row-on-air', title: 'TV On The Air', endpoint: 'tv/on_the_air', preview: 6 },
            { id: 'row-airing-today', title: 'TV Airing Today', endpoint: 'tv/airing_today', preview: 6 },
            { id: 'row-action', title: 'Action', endpoint: 'discover/movie?with_genres=28&sort_by=popularity.desc', preview: 6 },
            { id: 'row-comedy', title: 'Comedy', endpoint: 'discover/movie?with_genres=35&sort_by=popularity.desc', preview: 6 },
            { id: 'row-animation', title: 'Animation', endpoint: 'discover/movie?with_genres=16&sort_by=popularity.desc', preview: 6 },
            { id: 'row-scifi', title: 'Sciâ€‘Fi', endpoint: 'discover/movie?with_genres=878&sort_by=popularity.desc', preview: 6 },
            { id: 'row-horror', title: 'Horror', endpoint: 'discover/movie?with_genres=27&sort_by=popularity.desc', preview: 6 },
            { id: 'row-doc', title: 'Documentaries', endpoint: 'discover/movie?with_genres=99&sort_by=popularity.desc', preview: 6 },
            { id: 'row-romance', title: 'Romance', endpoint: 'discover/movie?with_genres=10749&sort_by=popularity.desc', preview: 6 },
            { id: 'row-fantasy', title: 'Fantasy', endpoint: 'discover/movie?with_genres=14&sort_by=popularity.desc', preview: 6 },
            { id: 'row-crime-tv', title: 'Crime TV', endpoint: 'discover/tv?with_genres=80&sort_by=popularity.desc', preview: 6 },
            { id: 'row-animation-tv', title: 'Animation TV', endpoint: 'discover/tv?with_genres=16&sort_by=popularity.desc', preview: 6 },
            { id: 'row-reality', title: 'Reality TV', endpoint: 'discover/tv?with_genres=10764&sort_by=popularity.desc', preview: 6 },
            { id: 'row-mystery', title: 'Mystery', endpoint: 'discover/movie?with_genres=9648&sort_by=popularity.desc', preview: 6 },
            { id: 'row-family', title: 'Family', endpoint: 'discover/movie?with_genres=10751&sort_by=popularity.desc', preview: 6 }
        ];

        function buildBrowseDOM() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            BROWSE_SECTIONS.forEach((sec) => {
                const wrap = document.createElement('div');
                wrap.className = 'media-section';
                wrap.id = 'sec-' + sec.id;
                wrap.innerHTML = `<div class="section-header"><div class="section-title">${sec.title}</div></div>
                                  <div class="media-row" id="${sec.id}"><div class="loading-wrap"><div class="loading-spinner"></div></div></div>`;
                container.appendChild(wrap);
            });
        }

        async function loadSectionData(sec) {
            const row = document.getElementById(sec.id);
            if (!row || row.dataset.loaded === 'true') return;
            row.dataset.loaded = 'true';
            try {
                const data = await fetchTMDB(sec.endpoint, { page: 1 });
                row.innerHTML = '';
                const slice = (data.results || []).filter((it) => inferMediaType(it) === 'movie' || inferMediaType(it) === 'tv').slice(0, sec.preview);
                slice.forEach((item) => {
                    const c = createCard(item);
                    if (c) row.appendChild(c);
                });
                row.appendChild(createShowAllBtn(sec.endpoint, sec.title));
            } catch (err) {
                row.innerHTML = '<div style="color:#f44336;padding:12px;">Failed to load: ' + sec.title + '</div>';
            }
        }

        async function init() {
            renderFavoritesRow();
            buildBrowseDOM();

            const initialSections = BROWSE_SECTIONS.slice(0, 4);
            const remainingSections = BROWSE_SECTIONS.slice(4);

            // Fetch top 4 visible categories in parallel for instant rendering
            await Promise.all(initialSections.map(s => loadSectionData(s)));

            // Fade page in immediately after initial visible rows are ready
            const overlay = document.getElementById('page-fade-overlay');
            if (overlay) overlay.classList.add('fade-out');

            // Lazy-load remaining rows on scroll
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const secId = entry.target.id.replace('sec-', '');
                            const sec = BROWSE_SECTIONS.find(s => s.id === secId);
                            if (sec) loadSectionData(sec);
                            obs.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '400px 0px' });

                remainingSections.forEach(s => {
                    const el = document.getElementById('sec-' + s.id);
                    if (el) observer.observe(el);
                });
            } else {
                for (const s of remainingSections) {
                    await loadSectionData(s);
                }
            }
        }

        async function collectPagedResults(endpoint, maxPages) {
            const merged = [];
            for (let page = 1; page <= maxPages; page++) {
                const data = await fetchTMDB(endpoint, { page });
                if (!data || !data.results || !data.results.length) break;
                merged.push.apply(merged, data.results);
                const totalPages = data.total_pages || 1;
                if (page >= totalPages) break;
            }
            return merged;
        }

        async function showGrid(endpoint, title, options) {
            const opts = options || {};
            const maxPages = opts.maxPages != null ? opts.maxPages : 8;
            const isSearch = endpoint.indexOf('search/multi') === 0;

            const browseView = document.getElementById('browse-view');
            const gridPanel = document.getElementById('grid-panel');
            const gridView = document.getElementById('grid-view');
            const backBtn = document.getElementById('back-btn');
            const searchHint = document.getElementById('search-hint');
            const srv = document.getElementById('search-results-view');

            browseView.style.display = 'none';
            if (srv) srv.style.display = 'none';
            gridPanel.classList.add('active');
            backBtn.classList.add('visible');

                    results = dedupeResults(first.results || []);
                    for (let page = 2; page <= totalPages; page++) {
                        const data = await fetchTMDB(endpoint, { page });

                } else {

        function showGridWithResults(results, title) {

        function resetView() {
            document.getElementById('browse-view').style.display = 'block';

            document.getElementById('back-btn').classList.remove('visible');

        document.getElementById('back-btn').onclick = resetView;

        // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
        //  INTELLIGENT SEARCH ENGINE
        // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
        const MOVIE_GENRES = {
            'action': 28, 'adventure': 12, 'animation': 16, 'animated': 16,
            'comedy': 35, 'crime': 80, 'documentary': 99, 'drama': 18,
            'family': 10751, 'fantasy': 14, 'history': 36, 'historical': 36,
            'horror': 27, 'music': 10402, 'musical': 10402, 'mystery': 9648,
            'romance': 10749, 'romantic': 10749, 'sci-fi': 878, 'scifi': 878,
            'science fiction': 878, 'thriller': 53, 'war': 10752, 'western': 37
        };
        const TV_GENRES = {
            'action': 10759, 'adventure': 10759, 'animation': 16, 'animated': 16,
            'comedy': 35, 'crime': 80, 'documentary': 99, 'drama': 18,
            'family': 10751, 'fantasy': 10765, 'kids': 10762, 'mystery': 9648,
            'news': 10763, 'reality': 10764, 'sci-fi': 10765, 'scifi': 10765,
            'science fiction': 10765, 'soap': 10766, 'talk': 10767,
            'war': 10768, 'western': 37
        };

        function parseSearchIntent(query) {
            const intent = { originalQuery: query, years: [], genres: [], mediaType: null, sortBy: null, keywords: [] };
            let text = query.toLowerCase().trim();

            // Extract years (1900-2099)
            const yearRe = /\b(19\d{2}|20\d{2})\b/g;
            let ym;
            while ((ym = yearRe.exec(text)) !== null) intent.years.push(parseInt(ym[1]));
            text = text.replace(yearRe, ' ');

            // Extract media type
            if (/\b(movies?|films?)\b/.test(text)) {
                intent.mediaType = 'movie';
                text = text.replace(/\b(movies?|films?)\b/g, ' ');
            } else if (/\b(tv|television|shows?|series)\b/.test(text)) {
                intent.mediaType = 'tv';
                text = text.replace(/\b(tv|television|shows?|series)\b/g, ' ');
            }

            // Extract genres (multi-word first, then single-word)
            const multiWord = ['science fiction', 'sci-fi'];
            for (const g of multiWord) {
                if (text.includes(g)) {
                    intent.genres.push({ name: g, movieId: MOVIE_GENRES[g], tvId: TV_GENRES[g] || MOVIE_GENRES[g] });
                    text = text.replace(new RegExp(g.replace(/-/g, '[-\\s]?'), 'g'), ' ');
                }
            }
            for (const [g, id] of Object.entries(MOVIE_GENRES)) {
                if (multiWord.includes(g)) continue;
                if (new RegExp('\\b' + g + '\\b').test(text)) {
                    if (!intent.genres.some(x => x.movieId === id)) {
                        intent.genres.push({ name: g, movieId: id, tvId: TV_GENRES[g] || id });
                    }
                    text = text.replace(new RegExp('\\b' + g + '\\b', 'g'), ' ');
                }
            }

            // Extract sort/quality modifiers
            if (/\b(best|top[\s-]?rated|highest[\s-]?rated)\b/.test(text)) {
                intent.sortBy = 'vote_average.desc';
                text = text.replace(/\b(best|top[\s-]?rated|highest[\s-]?rated)\b/g, ' ');
            } else if (/\b(popular|trending|hot)\b/.test(text)) {
                intent.sortBy = 'popularity.desc';
                text = text.replace(/\b(popular|trending|hot)\b/g, ' ');
            } else if (/\b(new|newest|latest|recent)\b/.test(text)) {
                intent.sortBy = intent.mediaType === 'tv' ? 'first_air_date.desc' : 'primary_release_date.desc';
                text = text.replace(/\b(new|newest|latest|recent)\b/g, ' ');
            }

            // Remove filler words
            text = text.replace(/\b(in|the|a|an|of|from|about|with|and|or|for|on|at|to|by|is|are|was|were|made|released|like|featuring|starring|set|during|era|based|between)\b/g, ' ');
            text = text.replace(/\s+/g, ' ').trim();
            if (text.length > 1) intent.keywords = text.split(' ').filter(w => w.length > 1);

            return intent;
        }

        async function fetchRelatedResults(intent, exactIds) {
            const promises = [];
            const exactIdSet = new Set(exactIds.map(String));

            // Strategy 1: Discover with genres / years
            if (intent.genres.length > 0 || intent.years.length > 0) {
                const types = intent.mediaType ? [intent.mediaType] : ['movie', 'tv'];
                for (const type of types) {
                    const params = { sort_by: intent.sortBy || 'popularity.desc' };
                    if (intent.genres.length) {
                        params.with_genres = intent.genres.map(g => type === 'tv' ? g.tvId : g.movieId).filter(Boolean).join(',');
                    }
                    if (intent.years.length) {
                        if (type === 'movie') params.primary_release_year = intent.years[0];
                        else params.first_air_date_year = intent.years[0];
                    }
                    if (intent.sortBy === 'vote_average.desc') params['vote_count.gte'] = 100;
                    promises.push(
                        fetchTMDB('discover/' + type, Object.assign({ page: 1 }, params))
                            .then(d => (d.results || []).map(it => { if (!it.media_type) it.media_type = type; return it; }))
                            .catch(() => [])
                    );
                }
            }

            // Strategy 2: Keyword discovery
            if (intent.keywords.length > 0) {
                promises.push(
                    fetchTMDB('search/keyword', { query: intent.keywords.join(' ') })
                        .then(async data => {
                            const kwIds = (data.results || []).slice(0, 3).map(k => k.id);
                            if (!kwIds.length) return [];
                            const types = intent.mediaType ? [intent.mediaType] : ['movie', 'tv'];
                            const out = [];
                            for (const type of types) {
                                const p = { with_keywords: kwIds.join('|'), sort_by: intent.sortBy || 'popularity.desc' };
                                if (intent.years.length) {
                                    if (type === 'movie') p.primary_release_year = intent.years[0];
                                    else p.first_air_date_year = intent.years[0];
                                }
                                try {
                                    const d = await fetchTMDB('discover/' + type, Object.assign({ page: 1 }, p));
                                    (d.results || []).forEach(it => { if (!it.media_type) it.media_type = type; out.push(it); });
                                } catch(e) {}
                            }
                            return out;
                        }).catch(() => [])
                );
            }

            // Strategy 3: Person search (actors, directors)
            if (intent.keywords.length > 0) {
                promises.push(
                    fetchTMDB('search/person', { query: intent.keywords.join(' ') })
                        .then(async data => {
                            const people = (data.results || []).filter(p => p.popularity > 5).slice(0, 2);
                            const credits = [];
                            for (const person of people) {
                                try {
                                    const c = await fetchTMDB('person/' + person.id + '/combined_credits');
                                    credits.push(...(c.cast || []).sort((a, b) => (b.popularity || 0) - (a.popularity || 0)).slice(0, 20));
                                } catch(e) {}
                            }
                            return credits;
                        }).catch(() => [])
                );
            }

            const batches = await Promise.all(promises);
            const merged = [];
            const seen = new Set();
            for (const batch of batches) {
                for (const item of batch) {
                    const mt = inferMediaType(item);
                    if (mt !== 'movie' && mt !== 'tv') continue;
                    const key = mt + ':' + item.id;
                    if (seen.has(key) || exactIdSet.has(String(item.id))) continue;
                    seen.add(key);
                    merged.push(item);
                }
            }
            merged.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
            return merged;
        }

        let searchAbortId = 0;

        async function performSmartSearch(query) {
            const myId = ++searchAbortId;
            const browseView = document.getElementById('browse-view');
            const gridPanel = document.getElementById('grid-panel');
            const searchResultsView = document.getElementById('search-results-view');
            const backBtn = document.getElementById('back-btn');

            browseView.style.display = 'none';
            gridPanel.classList.remove('active');
            searchResultsView.style.display = 'block';
            backBtn.classList.add('visible');

            const exactSection = document.getElementById('exact-matches-section');
            const relatedSection = document.getElementById('related-section');
            const exactRow = document.getElementById('row-exact-matches');
            const relatedRow = document.getElementById('row-related');

            // Loading state
            exactSection.style.display = 'block';
            relatedSection.style.display = 'block';
            exactRow.innerHTML = '<div class="loading-wrap"><div class="loading-spinner"></div></div>';
            relatedRow.innerHTML = '<div class="loading-wrap"><div class="loading-spinner"></div></div>';

            try {
                // Fetch exact matches via search/multi
                const searchData = await fetchTMDB('search/multi', { query: query, page: 1 });
                if (myId !== searchAbortId) return;

                let page2 = [];
                if (searchData.total_pages > 1) {
                    try { const p2 = await fetchTMDB('search/multi', { query: query, page: 2 }); page2 = p2.results || []; } catch(e) {}
                }
                if (myId !== searchAbortId) return;

                const allSearch = dedupeResults([...(searchData.results || []), ...page2]);
                const qLower = query.toLowerCase();

                // Exact = title/name contains the query string
                const exactMatches = allSearch.filter(item => (item.title || item.name || '').toLowerCase().includes(qLower));
                const exactIds = exactMatches.map(item => item.id);

                // Render exact matches
                if (exactMatches.length > 0) {
                    exactSection.style.display = 'block';
                    exactRow.innerHTML = '';
                    exactMatches.slice(0, 6).forEach(item => { const c = createCard(item); if (c) exactRow.appendChild(c); });
                    if (exactMatches.length > 6) {
                        const allExact = [...exactMatches];
                        const btn = document.createElement('div');
                        btn.className = 'show-all-btn';
                        btn.innerHTML = '<span style="font-size:28px;line-height:1;">+</span><span>Show All</span>';
                        btn.setAttribute('role', 'button');
                        btn.tabIndex = 0;
                        btn.onclick = () => showGridWithResults(allExact, 'Exact Matches: \u201c' + query + '\u201d');
                        exactRow.appendChild(btn);
                    }
                } else {
                    exactSection.style.display = 'none';
                }

                // Fetch related results using intelligent parsing
                const intent = parseSearchIntent(query);
                const relatedResults = await fetchRelatedResults(intent, exactIds);
                if (myId !== searchAbortId) return;

                // Also fold in non-exact search results as lower-priority related
                const exactIdSet = new Set(exactIds.map(String));
                const seenRelated = new Set(relatedResults.map(r => inferMediaType(r) + ':' + r.id));
                allSearch.filter(item => !(item.title || item.name || '').toLowerCase().includes(qLower))
                    .forEach(item => {
                        const key = inferMediaType(item) + ':' + item.id;
                        if (!seenRelated.has(key) && !exactIdSet.has(String(item.id))) {
                            seenRelated.add(key);
                            relatedResults.push(item);
                        }
                    });

                // Render related
                if (relatedResults.length > 0) {
                    relatedSection.style.display = 'block';
                    relatedRow.innerHTML = '';
                    relatedResults.slice(0, 12).forEach(item => { const c = createCard(item); if (c) relatedRow.appendChild(c); });
                    if (relatedResults.length > 12) {
                        const allRelated = [...relatedResults];
                        const btn = document.createElement('div');
                        btn.className = 'show-all-btn';
                        btn.innerHTML = '<span style="font-size:28px;line-height:1;">+</span><span>Show All</span>';
                        btn.setAttribute('role', 'button');
                        btn.tabIndex = 0;
                        btn.onclick = () => showGridWithResults(allRelated, 'Related: \u201c' + query + '\u201d');
                        relatedRow.appendChild(btn);
                    }
                } else {
                    relatedSection.style.display = 'none';
                }

                // Both empty
                if (exactMatches.length === 0 && relatedResults.length === 0) {
                    exactSection.style.display = 'none';
                    relatedSection.style.display = 'block';
                    relatedRow.innerHTML = '<div class="loading-wrap" style="color:#aaa;font-weight:bold;">No results found.</div>';
                }

            } catch(e) {
                if (myId !== searchAbortId) return;
                exactSection.style.display = 'none';
                relatedSection.style.display = 'block';
                relatedRow.innerHTML = '<div class="loading-wrap" style="color:#f44336;font-weight:bold;">Error: ' + (e.message || String(e)) + '</div>';
            }
        }

        const searchInput = document.getElementById('media-search');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) {
                searchAbortId++;
                resetView();
                return;
            }
            searchTimeout = setTimeout(() => {
                performSmartSearch(query);
            }, 450);
        });

        // --- PLAYER LOGIC ---
        function mediaProgressKey(type, id) {
            return 'tb_media_progress_' + type + '_' + id;
        }

            try {
                return JSON.parse(localStorage.getItem(mediaProgressKey(type, id)) || 'null') || {};
            } catch (e) {
                return {};
            }
        }

            const safeTitle = String(title).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const epJson = JSON.stringify(seasonsData).replace(/</g, '\\u003c');
            const savedProgressJson = JSON.stringify(savedProgress).replace(/</g, '\\u003c');
            const backIconUrl = new URL('Assets/media-back-arrow.svg', location.href).href;

<script>
(function(){
  const id = ${JSON.stringify(String(id))};
  const type = ${JSON.stringify(type)};
  const episodes = ${epJson};

  const progressKey = 'tb_media_progress_' + type + '_' + id;
