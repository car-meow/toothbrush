<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            background: #080808;
            color: #d7d7d7;
            font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main { width: min(92vw, 380px); text-align: center; }
        p { margin: 0; line-height: 1.5; }
        button {
            margin-top: 22px;
            padding: 10px 18px;
            border: 1px solid #737373;
            border-radius: 999px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }
        button:hover, button:focus-visible { background: #202020; }
    </style>
</head>
<body>
    <main>
        <p>Your game is open in another tab.</p>
        <p>Closing that tab will return you to Games.</p>
        <button type="button" id="return-to-games">Return to Games</button>
    </main>
    <script>
        (function () {
            function returnToGames() {
                window.location.replace('carmeow.html');
            }
            document.getElementById('return-to-games').addEventListener('click', returnToGames);
            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'nexus-popup-closed') returnToGames();
            });
        })();
    </script>
</body>
</html>
