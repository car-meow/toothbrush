<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <link rel="icon" id="dynamic-favicon" type="image/png" href="Assets/newtab.png">
    <link rel="shortcut icon" type="image/png" href="Assets/newtab.png">
    <link rel="stylesheet" href="style.css?v=65">
    <script>
        (function () {
            try {
                var storage = window.nexusStorage || window.localStorage;
                if (storage.getItem('tb_theme') === 'light') document.documentElement.classList.add('light-mode');
            } catch (error) {}
            try {
                var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var iconEl = document.getElementById('dynamic-favicon');
                if (iconEl && isDark) iconEl.href = 'Assets/newtabLight.png';
                var mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                if (mediaQuery) {
                    var updateIcon = function(e) {
                        var href = e.matches ? 'Assets/newtabLight.png' : 'Assets/newtab.png';
                        if (iconEl) iconEl.href = href;
                    };
                    if (mediaQuery.addEventListener) mediaQuery.addEventListener('change', updateIcon);
                    else if (mediaQuery.addListener) mediaQuery.addListener(updateIcon);
                }
            } catch (error) {}
        })();
    </script>
</head>
<body class="game-standby-active">
    <main class="game-standby-screen">
        <img class="game-standby-background" src="Assets/loading_stash.png" alt="">
        <button type="button" class="game-standby-back">Back to Games</button>
        <div id="page-fade-overlay" class="fade-out">
            <div class="nexus-transition-content"><img src="Assets/loadingRoll.gif" alt=""><span class="nexus-transition-label"></span></div>
        </div>
    </main>
    <div id="nexus-red-confirm-overlay">
        <div class="red-confirm-box">
            <div id="nexus-red-confirm-title">Warning</div>
            <div id="nexus-red-confirm-msg">Opening multiple games can cause low performance or bugs. Are you sure you want to continue?</div>
            <div style="display:flex; gap:14px; justify-content:center; margin-top:8px;">
                <button id="nexus-red-confirm-ok" class="red-dialog-ok-btn">OK</button>
                <button id="nexus-red-confirm-cancel" class="red-dialog-cancel-btn green-game-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var screen = document.querySelector('.game-standby-screen');
            var overlay = document.getElementById('page-fade-overlay');
            var confirmOverlay = document.getElementById('nexus-red-confirm-overlay');
            var returning = false;

            function returnToGames() {
                if (returning) return;
                returning = true;
                screen.classList.add('is-returning');
                overlay.classList.add('is-loading');
                window.setTimeout(function () {
                    window.location.replace('carmeow.html');
                }, 360);
            }

            document.querySelector('.game-standby-back').addEventListener('click', function () {
                confirmOverlay.style.display = 'flex';
                document.getElementById('nexus-red-confirm-ok').focus();
            });
            document.getElementById('nexus-red-confirm-ok').addEventListener('click', returnToGames);
            document.getElementById('nexus-red-confirm-cancel').addEventListener('click', function () {
                confirmOverlay.style.display = 'none';
            });
            document.addEventListener('keydown', function (event) {
                if (confirmOverlay.style.display !== 'flex') return;
                if (event.key === 'Enter') {
                    event.preventDefault();
                    returnToGames();
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    confirmOverlay.style.display = 'none';
                }
            });
            // 1. Cross-tab BroadcastChannel listener (works across isolated renderer processes)
            if (typeof BroadcastChannel === 'function') {
                try {
                    var sessionChannel = new BroadcastChannel('nexus-game-session');
                    sessionChannel.addEventListener('message', function (event) {
                        if (event.data && event.data.type === 'nexus-popup-closed') returnToGames();
                    });
                } catch (e) {}
            }

            // 2. Storage event listener (fallback across isolated renderer processes)
            window.addEventListener('storage', function (event) {
                if (event.key === 'nexus_popup_closed') returnToGames();
            });

            // 3. PostMessage listener (legacy fallback)
            window.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'nexus-popup-closed') returnToGames();
            });
        })();
    </script>
</body>
</html>
