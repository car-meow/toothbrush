<!DOCTYPE html>
<script>
  if (window.parent !== window.self) window.parent.postMessage("bonk", "*");
  window.addEventListener("DOMContentLoaded", function () {
    document.body.style.margin = "0";
    document.body.style.height = "100vh";
    document.body.style.overflow = "hidden";
  });
</script>
<html lang="en-us">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <style>
    #nexus-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background-color: #050505;
      background: radial-gradient(circle at 50% 40%, #1a1a24 0%, #08080c 70%, #000000 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .nexus-loader-bar-container {
      width: clamp(260px, 36vw, 440px);
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: clamp(60px, 12vh, 100px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .nexus-loader-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 10px;
      transition: width 0.2s ease-out;
    }
    @keyframes nexus-stripes-backward {
      0% { background-position: 56px 0; }
      100% { background-position: 0 0; }
    }
    .nexus-bar-busy {
      background-image: repeating-linear-gradient(
        -45deg,
        #ffffff 0px,
        #ffffff 14px,
        #a8a8a8 14px,
        #a8a8a8 28px
      ) !important;
      background-size: 39.6px 100% !important;
      animation: nexus-stripes-backward 0.75s linear infinite !important;
    }
  </style>

  <script>
    window.rWS = WebSocket;
    WebSocket = function (url, options) {
      var split = url.split("://");
      var prefix = "";
      if (!url.includes("arc.io")) {
        switch (split[0].toLowerCase()) {
          case "ws":
            prefix = "wss://onebigorange-tmm.tbt.mx/websocket/http://";
            break;
          case "wss":
            prefix = "wss://onebigorange-tmm.tbt.mx/websocket/https://";
            break;
          default:
            prefix = split[0];
        }
        return new (Function.prototype.bind.call(
          window.rWS,
          null,
          (split[1].match(/\//g) || []).length === 0
            ? split[1].includes("?")
              ? prefix + split[1].replace("?", "/?")
              : prefix + split[1] + "/"
            : prefix + split[1],
          options
        ))();
      } else {
        return new window.rWS(url, options);
      }
    };
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (...args) {
      if (!args[1].includes("arc.io"))
        args[1] = /^http/.test(args[1])
          ? "https://onebigstatic-tmm.tbt.mx/static/" + args[1]
          : args[1];
      origOpen.apply(this, args);
    };

    var nexusProgress = 0;
    var isNexusDone = false;
    var nexusBar = null;
    var nexusOverlay = null;
    var busyTimer = null;
    var creepTimer = null;
    var creepStartTimer = null;
    var drawCount = 0;
    var activeFrames = 0;
    var isUnityRuntimeReady = false;

    // Intercept WebGL context creation and draw operations
    try {
      var origGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function(type) {
        var ctx = origGetContext.apply(this, arguments);
        if (!ctx) return ctx;
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          var oDA = ctx.drawArrays;
          if (oDA) ctx.drawArrays = function(m, f, count) { if (count > 0) drawCount++; return oDA.apply(this, arguments); };
          var oDE = ctx.drawElements;
          if (oDE) ctx.drawElements = function(m, count) { if (count > 0) drawCount++; return oDE.apply(this, arguments); };
        }
        return ctx;
      };
    } catch(e) {}

    function initNexusLoading() {
      nexusBar = document.getElementById('nexus-loader-bar');
      nexusOverlay = document.getElementById('nexus-loading-screen');
      if (nexusOverlay) {
        var bgUrl = 'Assets/loading_screen.png';
        try {
          var base = window.location.href.split('?')[0].split('#')[0];
          bgUrl = base.substring(0, base.lastIndexOf('/') + 1) + 'Assets/loading_screen.png';
        } catch(e) {}
        nexusOverlay.style.backgroundImage = "url('" + bgUrl + "')";
      }
      busyTimer = setTimeout(function() {
        if (!isNexusDone && nexusBar) {
          nexusBar.classList.add('nexus-bar-busy');
        }
      }, 700);

      creepStartTimer = setTimeout(function() {
        if (isNexusDone) return;
        creepTimer = setInterval(function() {
          if (isNexusDone) {
            clearInterval(creepTimer);
            return;
          }
          if (nexusProgress < 99) {
            var remaining = 99 - nexusProgress;
            var step = Math.max(0.1, remaining * 0.04);
            nexusProgress = Math.min(99, nexusProgress + step);
            if (nexusBar) nexusBar.style.width = nexusProgress + '%';
          }
        }, 100);
      }, 2000);
    }

    function updateNexusProgress(pct) {
      if (isNexusDone || !nexusBar) return;
      nexusProgress = Math.max(nexusProgress, Math.min(99, pct));
      nexusBar.style.width = nexusProgress + '%';
    }

    function completeNexusLoading() {
      if (isNexusDone) return;
      isNexusDone = true;
      if (busyTimer) clearTimeout(busyTimer);
      if (creepStartTimer) clearTimeout(creepStartTimer);
      if (creepTimer) clearInterval(creepTimer);
      if (nexusBar) {
        nexusBar.style.transition = 'width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
        nexusBar.style.width = '100%';
      }

      setTimeout(function() {
        if (nexusOverlay) {
          nexusOverlay.style.transition = 'opacity 0.4s ease';
          nexusOverlay.style.opacity = '0';
          nexusOverlay.style.pointerEvents = 'none';
          setTimeout(function() {
            if (nexusOverlay && nexusOverlay.parentNode) {
              nexusOverlay.parentNode.removeChild(nexusOverlay);
            }
            nexusOverlay = null;
            nexusBar = null;
          }, 450);
        }
      }, 120);
    }

    var lastDraws = 0;
    function checkSlopeRender() {
      if (isNexusDone) return;
      var canvas = document.querySelector('#gameContainer canvas') || document.querySelector('canvas');
      if (canvas && drawCount > lastDraws) {
        activeFrames++;
        updateNexusProgress(90 + Math.min(8, activeFrames * 2));
      }
      lastDraws = drawCount;

      if (isUnityRuntimeReady && activeFrames >= 3) {
        completeNexusLoading();
        return;
      }
      requestAnimationFrame(checkSlopeRender);
    }
    requestAnimationFrame(checkSlopeRender);

    // Universal Instant Ad Reward Bypass Engine
    window.PokiSDK = window.PokiSDK || {
      init: function() { return Promise.resolve(); },
      commercialBreak: function() { return Promise.resolve(); },
      rewardedBreak: function(fn) { if (typeof fn === 'function') try { fn(true); } catch(e) {} return Promise.resolve(true); }
    };
    window.rewardedBreak = function() { return Promise.resolve(true); };
    window.commercialBreak = function() { return Promise.resolve(); };

    function customUnityProgress(gameInstance, progress) {
      if (typeof progress === 'number') {
        updateNexusProgress(Math.min(88, progress * 88));
        if (progress >= 1) {
          updateNexusProgress(92);
        }
      } else if (progress === 'complete' || progress === 1 || progress === 1.0) {
        isUnityRuntimeReady = true;
        updateNexusProgress(95);
        setTimeout(function() {
          if (!isNexusDone) completeNexusLoading();
        }, 1200);
      }
      if (typeof UnityProgress === 'function' && UnityProgress !== customUnityProgress) {
        try { UnityProgress(gameInstance, progress); } catch(e) {}
      }
    }

    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/slope_27Sept.json",
      {
        onProgress: customUnityProgress,
        Module: {
          onRuntimeInitialized: function () {
            isUnityRuntimeReady = true;
            updateNexusProgress(95);
            setTimeout(function() {
              if (!isNexusDone) completeNexusLoading();
            }, 1200);
          },
          postRun: [
            function() {
              isUnityRuntimeReady = true;
              updateNexusProgress(98);
              setTimeout(function() {
                if (!isNexusDone) completeNexusLoading();
              }, 1200);
            }
          ]
        },
      }
    );

    // Universal Autosave & Restore Bridge for Slope
    (function() {
      var gameAliases = ['slope', 'bookmark_stash:slope.html'];

      function saveSnapshotDirectToDB(incomingData) {
        if (!incomingData) return;
        var incomingLs = incomingData.localStorage || {};
        var incomingFs = incomingData.fsData || null;
        var incomingIdb = incomingData.idbData || null;
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) return;
              var tx = db.transaction('gameSnapshots', 'readwrite');
              var store = tx.objectStore('gameSnapshots');
              var getReq = store.get(gameAliases[0]);
              getReq.onsuccess = function() {
                var existing = getReq.result || null;
                var existingData = (existing && existing.localStorage && typeof existing.localStorage === 'object') ? existing.localStorage : {};
                var incomingKeys = Object.keys(incomingLs);
                var existingKeys = Object.keys(existingData);

                var lsToSave = Object.assign({}, incomingLs);
                if (incomingKeys.length === 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData);
                } else if (incomingKeys.length > 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData, incomingLs);
                }

                var fsToSave = (existing && existing.fsData) ? Object.assign({}, existing.fsData) : null;
                if (incomingFs && Object.keys(incomingFs).length > 0) {
                  fsToSave = Object.assign({}, fsToSave || {}, incomingFs);
                }

                var idbToSave = (existing && existing.idbData) ? Object.assign({}, existing.idbData) : null;
                if (incomingIdb && Object.keys(incomingIdb).length > 0) {
                  idbToSave = Object.assign({}, idbToSave || {}, incomingIdb);
                }

                var savedAt = Date.now();
                var history = Array.isArray(existing && existing.history) ? existing.history.slice(-4) : [];
                if (existing && (existing.localStorage || existing.fsData || existing.idbData)) {
                  history.push({
                    localStorage: existing.localStorage,
                    fsData: existing.fsData,
                    idbData: existing.idbData,
                    savedAt: existing.savedAt || savedAt
                  });
                }

                gameAliases.forEach(function(targetId) {
                  if (!targetId) return;
                  var record = {
                    gameId: targetId,
                    localStorage: lsToSave,
                    fsData: fsToSave,
                    idbData: idbToSave,
                    savedAt: savedAt,
                    history: history
                  };
                  try { store.put(record); } catch(err) {}
                });
              };
            } catch(txErr) {}
          };
        } catch(err) {}
      }

      function readSnapshotDirectFromDB(callback) {
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) {
                if (callback) callback(null);
                return;
              }
              var tx = db.transaction('gameSnapshots', 'readonly');
              var store = tx.objectStore('gameSnapshots');
              var idx = 0;
              function checkNext() {
                if (idx >= gameAliases.length) {
                  if (callback) callback(null);
                  return;
                }
                var curId = gameAliases[idx++];
                var getReq = store.get(curId);
                getReq.onsuccess = function() {
                  var res = getReq.result;
                  if (res && (res.localStorage || res.fsData || res.idbData)) {
                    if (callback) callback(res);
                  } else {
                    checkNext();
                  }
                };
                getReq.onerror = function() { checkNext(); };
              }
              checkNext();
            } catch(txErr) {
              if (callback) callback(null);
            }
          };
          req.onerror = function() { if (callback) callback(null); };
        } catch(err) {
          if (callback) callback(null);
        }
      }

      function getFS() {
        return window.FS || (window.gameInstance && window.gameInstance.Module && window.gameInstance.Module.FS);
      }

      function sendSave() {
        try {
          var s = {};
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('tb_') !== 0) s[k] = localStorage.getItem(k);
          }
          var msg = { type: 'nexus-game-save', gameId: 'slope', localStorage: s };
          saveSnapshotDirectToDB(msg);
          if (window.parent && window.parent !== window) {
            try { window.parent.postMessage(msg, '*'); } catch(e) {}
          }
          var opener = (window.parent && window.parent.opener) || window.opener;
          if (opener) {
            try { opener.postMessage(msg, '*'); } catch(e) {}
          }
        } catch(e) {}
      }

      function syncAndSend() {
        try {
          var fs = getFS();
          if (fs && typeof fs.syncfs === 'function') {
            fs.syncfs(false, function() { sendSave(); });
            return;
          }
        } catch(e) {}
        sendSave();
      }

      function applyRestore(data) {
        if (!data) return;
        if (data.localStorage && typeof data.localStorage === 'object') {
          Object.keys(data.localStorage).forEach(function(k) {
            if (k && k.indexOf('tb_') !== 0) localStorage.setItem(k, data.localStorage[k]);
          });
        }
        var fs = getFS();
        if (fs && typeof fs.syncfs === 'function') {
          try { fs.syncfs(true, function() {}); } catch(e) {}
        }
      }

      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'nexus-request-game-save') syncAndSend();
        if (e.data.type === 'nexus-apply-game-restore') applyRestore(e.data);
      });

      window.addEventListener('pagehide', syncAndSend, { passive: true });
      window.addEventListener('beforeunload', syncAndSend, { passive: true });
      setInterval(syncAndSend, 4000);

      // Request restore immediately upon loading
      var reqMsg = { type: 'nexus-request-game-restore', gameId: 'slope' };
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(reqMsg, '*'); } catch(e) {}
      }
      var opener = (window.parent && window.parent.opener) || window.opener;
      if (opener) {
        try { opener.postMessage(reqMsg, '*'); } catch(e) {}
      }
      readSnapshotDirectFromDB(function(snap) {
        if (snap) applyRestore(snap);
      });
    })();

    setTimeout(function() {
      if (!isNexusDone) completeNexusLoading();
    }, 18000);
  </script>

  </div>
  <script>initNexusLoading();</script>
