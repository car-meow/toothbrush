<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Spaceflight Simulator</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #nexus-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background-color: #050505;
        background: radial-gradient(circle at 50% 40%, #1a1a24 0%, #08080c 70%, #000000 100%);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        pointer-events: auto;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .nexus-loader-bar-container {
        width: clamp(260px, 36vw, 440px);
        height: 16px;
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: clamp(60px, 12vh, 100px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }
      .nexus-loader-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #ffffff;
        border-radius: 10px;
        transition: width 0.2s ease-out;
      }
      @keyframes nexus-stripes-backward {
        0% { background-position: 56px 0; }
        100% { background-position: 0 0; }
      }
      .nexus-bar-busy {
        background-image: repeating-linear-gradient(
          -45deg,
          #ffffff 0px,
          #ffffff 14px,
          #a8a8a8 14px,
          #a8a8a8 28px
        ) !important;
        background-size: 39.6px 100% !important;
        animation: nexus-stripes-backward 0.75s linear infinite !important;
      }
      #unity-warning, #unity-loading-bar, #loading-text {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Nexus Loading Screen Overlay -->
    <div id="nexus-loading-screen">
      <div class="nexus-loader-bar-container">
        <div id="nexus-loader-bar" class="nexus-loader-bar-fill"></div>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-warning" style="display:none !important;"></div>
    </div>

    <script>
    // Suppress non-fatal Unity alerts & warnings
    (function() {
      var nativeAlert = window.alert;
      window.alert = function(msg) {
        console.warn("Suppressed Unity alert:", msg);
      };
    })();

    (function() {
      var nexusBar = document.getElementById('nexus-loader-bar');
      var nexusOverlay = document.getElementById('nexus-loading-screen');
      var nexusProgress = 0;
      var isNexusDone = false;
      var busyTimer = null;
      var creepTimer = null;
      var creepStartTimer = null;

      // Initialize loading screen background safely resolving relative to page origin
      if (nexusOverlay) {
        var bgUrl = '../Assets/loading_screen.png';
        try {
          var base = window.location.href.split('?')[0].split('#')[0];
          var dir = base.substring(0, base.lastIndexOf('/'));
          var rootDir = dir.substring(0, dir.lastIndexOf('/') + 1);
          bgUrl = rootDir + 'Assets/loading_screen.png';
        } catch(e) {}
        nexusOverlay.style.backgroundImage = "url('" + bgUrl + "')";
      }

      busyTimer = setTimeout(function() {
        if (!isNexusDone && nexusBar) {
          nexusBar.classList.add('nexus-bar-busy');
        }
      }, 700);

      creepStartTimer = setTimeout(function() {
        if (isNexusDone) return;
        creepTimer = setInterval(function() {
          if (isNexusDone) {
            clearInterval(creepTimer);
            return;
          }
          if (nexusProgress < 99) {
            var remaining = 99 - nexusProgress;
            var step = Math.max(0.1, remaining * 0.04);
            nexusProgress = Math.min(99, nexusProgress + step);
            if (nexusBar) nexusBar.style.width = nexusProgress + '%';
          }
        }, 100);
      }, 2000);

      function updateNexusProgress(pct) {
        if (isNexusDone || !nexusBar) return;
        nexusProgress = Math.max(nexusProgress, Math.min(99, pct));
        nexusBar.style.width = nexusProgress + '%';
      }

      function completeNexusLoading() {
        if (isNexusDone) return;
        isNexusDone = true;
        if (busyTimer) clearTimeout(busyTimer);
        if (creepStartTimer) clearTimeout(creepStartTimer);
        if (creepTimer) clearInterval(creepTimer);
        if (nexusBar) {
          nexusBar.style.transition = 'width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
          nexusBar.style.width = '100%';
        }
        var canvas = document.querySelector("#unity-canvas");
        if (canvas) canvas.style.visibility = 'visible';

        setTimeout(function() {
          if (nexusOverlay) {
            nexusOverlay.style.transition = 'opacity 0.4s ease';
            nexusOverlay.style.opacity = '0';
            nexusOverlay.style.pointerEvents = 'none';
            setTimeout(function() {
              if (nexusOverlay && nexusOverlay.parentNode) {
                nexusOverlay.parentNode.removeChild(nexusOverlay);
              }
              nexusOverlay = null;
              nexusBar = null;
            }, 450);
          }
        }, 120);
      }

      let totalBytesLoaded = 0;
      const expectedTotalBytes = 92 * 1024 * 1024; // ~92MB total for split data and wasm files

      async function fetchWithProgress(url) {
        let response;
        try {
          response = await fetch(url);
          if (!response.ok) throw new Error('HTTP status ' + response.status);
        } catch (err) {
          // Fallback to CDN if local fetch fails
          console.warn('Local fetch failed for ' + url + ', trying CDN fallback...', err);
          const cdnBase = 'https://cdn.jsdelivr.net/gh/web-ports/spaceflight-simulator@main/';
          response = await fetch(cdnBase + url);
        }

        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          totalBytesLoaded += value.length;
          chunks.push(value);

          const pct = Math.min(70, Math.round((totalBytesLoaded / expectedTotalBytes) * 70));
          updateNexusProgress(pct);
        }

        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          cache = await caches.open("sfs-cache");
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            const blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }
        } catch (e) {}

        const buffers = await Promise.all(
          fileParts.map(part => fetchWithProgress(part))
        );
        const mergedBlob = new Blob(buffers);
        if (cache) {
          try {
            const response = new Response(mergedBlob);
            await cache.put(cacheKey, response);
          } catch(e) {}
        }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        try {
          updateNexusProgress(15);
          const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(getParts("Build/sfsim.data", 1, 3), "sfsim.data"),
            mergeFiles(getParts("Build/sfsim.wasm", 1, 3), "sfsim.wasm"),
          ]);

          updateNexusProgress(72);

          const canvas = document.querySelector("#unity-canvas");
          const buildUrl = "Build";
          const loaderUrl = buildUrl + "/sfsim.loader.js";

          const config = {
            arguments: [],
            dataUrl: dataUrl,
            frameworkUrl: buildUrl + "/sfsim.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Stef Morojna",
            productName: "Spaceflight Simulator",
            productVersion: "1.6.00.16",
            showBanner: function() {},
            errorHandler: function(err, url, line) {
              console.warn("Handled Unity error:", err, url, line);
              return true;
            },
            startupErrorHandler: function(err) {
              console.warn("Handled Unity startup error:", err);
            }
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
          }

          const script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            if (typeof createUnityInstance !== 'function') {
              console.error('createUnityInstance not found');
              return;
            }

            createUnityInstance(canvas, config, (progress) => {
              const unityPct = 72 + Math.round(progress * 26);
              updateNexusProgress(unityPct);
            }).then((unityInstance) => {
              window.unityInstance = unityInstance;
              if (unityInstance.Module) {
                window.Module = unityInstance.Module;
                window.FS = unityInstance.Module.FS;
              }
              // Trigger initial FS sync and startup restore
              try {
                if (window.FS && typeof FS.syncfs === 'function') {
                  FS.syncfs(true, function() {});
                }
              } catch(e) {}
              completeNexusLoading();
            }).catch((message) => {
              console.error('Unity instance error:', message);
              completeNexusLoading();
            });
          };
          script.onerror = () => {
            console.error('Failed to load sfsim.loader.js');
            completeNexusLoading();
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error('Spaceflight Simulator loading error:', err);
          completeNexusLoading();
        }
      })();

      // Safety fallback timeout
      setTimeout(() => {
        if (!isNexusDone) completeNexusLoading();
      }, 25000);
    })();
    </script>

    <!-- Universal Autosave & Restore Bridge for Spaceflight Simulator -->
    <script>
    (function() {
      var gameAliases = [
        'spaceflightsimulator',
        'sfs',
        'SpaceflightSimulator/sfs.html',
        'sfs.html',
        'bookmark_stash:SpaceflightSimulator/sfs.html',
        'bookmark_stash:sfs.html'
      ];

      // Helpers for binary base64 conversion
      function b64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      function bytesToB64(bytes) {
        var bin = '';
        var chunk = 0x8000;
        for (var i = 0; i < bytes.length; i += chunk) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      function getFS() {
        return window.FS || (window.unityInstance && window.unityInstance.Module && window.unityInstance.Module.FS);
      }

      // Capture all files in the Unity virtual filesystem (/idbfs and /)
      function getSfsFsFiles() {
        var files = {};
        var fs = getFS();
        if (!fs || typeof fs.readdir !== 'function') return files;
        function walk(dir) {
          try {
            var list = fs.readdir(dir);
            for (var i = 0; i < list.length; i++) {
              var item = list[i];
              if (item === '.' || item === '..' || item === 'dev' || item === 'proc' || item === 'tmp') continue;
              var full = (dir === '/' ? '' : dir) + '/' + item;
              var stat = fs.stat(full);
              if (fs.isDir(stat.mode)) {
                walk(full);
              } else if (fs.isFile(stat.mode)) {
                var data = fs.readFile(full);
                files[full] = {
                  data: bytesToB64(data),
                  mode: stat.mode,
                  timestamp: (stat.mtime instanceof Date) ? stat.mtime.getTime() : (stat.mtime || Date.now())
                };
              }
            }
          } catch(e) {}
        }
        walk('/idbfs');
        return files;
      }

      // Restore files into Unity virtual filesystem
      function restoreSfsFsFiles(files) {
        if (!files || typeof files !== 'object') return;
        var fs = getFS();
        if (!fs || typeof fs.writeFile !== 'function') return;
        try {
          Object.keys(files).forEach(function(fullPath) {
            var item = files[fullPath];
            if (!item || !item.data) return;
            var parts = fullPath.split('/');
            parts.pop();
            var cur = '';
            for (var i = 0; i < parts.length; i++) {
              if (!parts[i]) continue;
              cur += '/' + parts[i];
              try {
                var stat = fs.stat(cur);
                if (!fs.isDir(stat.mode)) fs.mkdir(cur);
              } catch(e) {
                try { fs.mkdir(cur); } catch(err) {}
              }
            }
            var bytes = b64ToBytes(item.data);
            fs.writeFile(fullPath, bytes, { canOwn: true });
            if (item.mode) { try { fs.chmod(fullPath, item.mode); } catch(e) {} }
            if (item.timestamp) { try { fs.utime(fullPath, item.timestamp, item.timestamp); } catch(e) {} }
          });
          if (typeof fs.syncfs === 'function') {
            try { fs.syncfs(false, function() {}); } catch(e) {}
          }
        } catch(e) {
          console.error("SFS FS restore error:", e);
        }
      }

      // Read Unity IndexedDB /idbfs store FILE_DATA directly
      function readSfsIdbRecords(callback) {
        try {
          var req = indexedDB.open('/idbfs');
          req.onerror = function() { callback(null); };
          req.onsuccess = function(e) {
            var idb = e.target.result;
            idb.onversionchange = function() { try { idb.close(); } catch(err) {} };
            if (!idb.objectStoreNames.contains('FILE_DATA')) {
              idb.close();
              return callback(null);
            }
            var tx = idb.transaction('FILE_DATA', 'readonly');
            var store = tx.objectStore('FILE_DATA');
            var kReq = store.getAllKeys();
            var vReq = store.getAll();
            var done = 0;
            var keys = null, vals = null;
            function check() {
              done++;
              if (done === 2) {
                idb.close();
                if (!keys || !vals || keys.length === 0) return callback(null);
                var recs = {};
                for (var j = 0; j < keys.length; j++) {
                  var v = vals[j];
                  recs[keys[j]] = {
                    timestamp: (v && v.timestamp instanceof Date) ? v.timestamp.getTime() : (v ? v.timestamp : Date.now()),
                    mode: v ? v.mode : 33206,
                    contents: v && v.contents ? bytesToB64(new Uint8Array(v.contents)) : null
                  };
                }
                callback(recs);
              }
            }
            kReq.onsuccess = function() { keys = kReq.result; check(); };
            kReq.onerror = function() { check(); };
            vReq.onsuccess = function() { vals = vReq.result; check(); };
            vReq.onerror = function() { check(); };
          };
        } catch(e) {
          callback(null);
        }
      }

      // Write Unity IndexedDB /idbfs store FILE_DATA directly
      function writeSfsIdbRecords(records, callback) {
        if (!records || typeof records !== 'object' || Object.keys(records).length === 0) {
          if (callback) callback();
          return;
        }
        try {
          var req = indexedDB.open('/idbfs', 21);
          req.onupgradeneeded = function(e) {
            var idb = e.target.result;
            var store;
            if (!idb.objectStoreNames.contains('FILE_DATA')) {
              store = idb.createObjectStore('FILE_DATA');
            } else {
              store = e.target.transaction.objectStore('FILE_DATA');
            }
            if (!store.indexNames.contains('timestamp')) {
              try { store.createIndex('timestamp', 'timestamp', { unique: false }); } catch(err) {}
            }
          };
          req.onsuccess = function(e) {
            var idb = e.target.result;
            idb.onversionchange = function() { try { idb.close(); } catch(err) {} };
            try {
              var tx = idb.transaction('FILE_DATA', 'readwrite');
              var store = tx.objectStore('FILE_DATA');
              Object.keys(records).forEach(function(pathKey) {
                var r = records[pathKey];
                if (!r) return;
                var rawBytes = r.contents ? b64ToBytes(r.contents) : new Uint8Array(0);
                var entry = {
                  timestamp: r.timestamp ? new Date(r.timestamp) : new Date(),
                  mode: r.mode || 33206,
                  contents: rawBytes
                };
                try { store.put(entry, pathKey); } catch(putErr) {}
              });
              tx.oncomplete = function() {
                idb.close();
                if (callback) callback();
              };
              tx.onerror = function() {
                idb.close();
                if (callback) callback();
              };
            } catch(txErr) {
              try { idb.close(); } catch(cErr) {}
              if (callback) callback();
            }
          };
          req.onerror = function() { if (callback) callback(); };
        } catch(err) {
          if (callback) callback();
        }
      }

      function saveSnapshotDirectToDB(incomingData) {
        if (!incomingData) return;
        var incomingLs = incomingData.localStorage || {};
        var incomingFs = incomingData.fsData || null;
        var incomingIdb = incomingData.idbData || null;
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) return;
              var tx = db.transaction('gameSnapshots', 'readwrite');
              var store = tx.objectStore('gameSnapshots');
              var getReq = store.get(gameAliases[0]);
              getReq.onsuccess = function() {
                var existing = getReq.result || null;
                var existingData = (existing && existing.localStorage && typeof existing.localStorage === 'object') ? existing.localStorage : {};
                var incomingKeys = Object.keys(incomingLs);
                var existingKeys = Object.keys(existingData);

                var lsToSave = Object.assign({}, incomingLs);
                if (incomingKeys.length === 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData);
                } else if (incomingKeys.length > 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData, incomingLs);
                }

                var fsToSave = (existing && existing.fsData) ? Object.assign({}, existing.fsData) : null;
                if (incomingFs && Object.keys(incomingFs).length > 0) {
                  fsToSave = Object.assign({}, fsToSave || {}, incomingFs);
                }

                var idbToSave = (existing && existing.idbData) ? Object.assign({}, existing.idbData) : null;
                if (incomingIdb && Object.keys(incomingIdb).length > 0) {
                  idbToSave = Object.assign({}, idbToSave || {}, incomingIdb);
                }

                var savedAt = Date.now();
                var history = Array.isArray(existing && existing.history) ? existing.history.slice(-4) : [];
                if (existing && (existing.localStorage || existing.fsData || existing.idbData)) {
                  history.push({
                    localStorage: existing.localStorage,
                    fsData: existing.fsData,
                    idbData: existing.idbData,
                    savedAt: existing.savedAt || savedAt
                  });
                }

                gameAliases.forEach(function(targetId) {
                  if (!targetId) return;
                  var record = {
                    gameId: targetId,
                    localStorage: lsToSave,
                    fsData: fsToSave,
                    idbData: idbToSave,
                    savedAt: savedAt,
                    history: history
                  };
                  try { store.put(record); } catch(err) {}
                });
              };
            } catch(txErr) {}
          };
        } catch(err) {}
      }

      function readSnapshotDirectFromDB(callback) {
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) {
                if (callback) callback(null);
                return;
              }
              var tx = db.transaction('gameSnapshots', 'readonly');
              var store = tx.objectStore('gameSnapshots');
              var idx = 0;
              function checkNext() {
                if (idx >= gameAliases.length) {
                  if (callback) callback(null);
                  return;
                }
                var curId = gameAliases[idx++];
                var getReq = store.get(curId);
                getReq.onsuccess = function() {
                  var res = getReq.result;
                  if (res && (res.localStorage || res.fsData || res.idbData)) {
                    if (callback) callback(res);
                  } else {
                    checkNext();
                  }
                };
                getReq.onerror = function() { checkNext(); };
              }
              checkNext();
            } catch(txErr) {
              if (callback) callback(null);
            }
          };
          req.onerror = function() { if (callback) callback(null); };
        } catch(err) {
          if (callback) callback(null);
        }
      }

      function sendSave() {
        try {
          var s = {};
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('tb_') !== 0) s[k] = localStorage.getItem(k);
          }
          var fsFiles = getSfsFsFiles();
          readSfsIdbRecords(function(idbRecs) {
            var msg = {
              type: 'nexus-game-save',
              gameId: 'spaceflightsimulator',
              localStorage: s,
              fsData: (fsFiles && Object.keys(fsFiles).length > 0) ? fsFiles : null,
              idbData: (idbRecs && Object.keys(idbRecs).length > 0) ? idbRecs : null
            };
            saveSnapshotDirectToDB(msg);
            if (window.parent && window.parent !== window) {
              try { window.parent.postMessage(msg, '*'); } catch(e) {}
            }
            var opener = (window.parent && window.parent.opener) || window.opener;
            if (opener) {
              try { opener.postMessage(msg, '*'); } catch(e) {}
            }
          });
        } catch(e) {}
      }

      function syncAndSend() {
        try {
          var fs = getFS();
          if (fs && typeof fs.syncfs === 'function') {
            fs.syncfs(false, function() { sendSave(); });
            return;
          }
        } catch(e) {}
        sendSave();
      }

      function applyRestore(data) {
        if (!data) return;
        if (data.localStorage && typeof data.localStorage === 'object') {
          Object.keys(data.localStorage).forEach(function(k) {
            if (k && k.indexOf('tb_') !== 0) localStorage.setItem(k, data.localStorage[k]);
          });
        }
        if (data.idbData && typeof data.idbData === 'object' && Object.keys(data.idbData).length > 0) {
          writeSfsIdbRecords(data.idbData, function() {
            var fs = getFS();
            if (fs && typeof fs.syncfs === 'function') {
              try { fs.syncfs(true, function() {}); } catch(e) {}
            }
          });
        }
        if (data.fsData && typeof data.fsData === 'object' && Object.keys(data.fsData).length > 0) {
          restoreSfsFsFiles(data.fsData);
        }
      }

      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'nexus-request-game-save') syncAndSend();
        if (e.data.type === 'nexus-apply-game-restore') applyRestore(e.data);
      });

      window.addEventListener('pagehide', syncAndSend, { passive: true });
      window.addEventListener('beforeunload', syncAndSend, { passive: true });
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) syncAndSend();
      }, { passive: true });

      // Periodic filesystem sync and snapshot commit
      setInterval(function() {
        try {
          var fs = getFS();
          if (fs && typeof fs.syncfs === 'function') {
            fs.syncfs(false, function() {});
          }
        } catch(e) {}
      }, 2500);

      setInterval(syncAndSend, 4000);

      // Proactively request restore from parent and opener, and load directly from IDB
      var reqMsg = { type: 'nexus-request-game-restore', gameId: 'spaceflightsimulator' };
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(reqMsg, '*'); } catch(e) {}
      }
      var opener = (window.parent && window.parent.opener) || window.opener;
      if (opener) {
        try { opener.postMessage(reqMsg, '*'); } catch(e) {}
      }
      readSnapshotDirectFromDB(function(snap) {
        if (snap) applyRestore(snap);
      });
    })();
    </script>
  </body>
