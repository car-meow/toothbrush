<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Spaceflight Simulator</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      #nexus-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background-color: #050505;
        background: radial-gradient(circle at 50% 40%, #1a1a24 0%, #08080c 70%, #000000 100%);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        pointer-events: auto;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .nexus-loader-bar-container {
        width: clamp(260px, 36vw, 440px);
        height: 16px;
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: clamp(60px, 12vh, 100px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      }
      .nexus-loader-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #ffffff;
        border-radius: 10px;
        transition: width 0.2s ease-out;
      }
      @keyframes nexus-stripes-backward {
        0% { background-position: 56px 0; }
        100% { background-position: 0 0; }
      }
      .nexus-bar-busy {
        background-image: repeating-linear-gradient(
          -45deg,
          #ffffff 0px,
          #ffffff 14px,
          #a8a8a8 14px,
          #a8a8a8 28px
        ) !important;
        background-size: 39.6px 100% !important;
        animation: nexus-stripes-backward 0.75s linear infinite !important;
      }
    </style>
  </head>
  <body>
    <!-- Nexus Loading Screen Overlay -->
    <div id="nexus-loading-screen">
      <div class="nexus-loader-bar-container">
        <div id="nexus-loader-bar" class="nexus-loader-bar-fill"></div>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-warning"> </div>
    </div>

    <script>
    (function() {
      var nexusBar = document.getElementById('nexus-loader-bar');
      var nexusOverlay = document.getElementById('nexus-loading-screen');
      var nexusProgress = 0;
      var isNexusDone = false;
      var busyTimer = null;
      var creepTimer = null;
      var creepStartTimer = null;

      // Initialize loading screen background safely resolving relative to page origin
      if (nexusOverlay) {
        var bgUrl = '../Assets/loading_screen.png';
        try {
          var base = window.location.href.split('?')[0].split('#')[0];
          var dir = base.substring(0, base.lastIndexOf('/'));
          var rootDir = dir.substring(0, dir.lastIndexOf('/') + 1);
          bgUrl = rootDir + 'Assets/loading_screen.png';
        } catch(e) {}
        nexusOverlay.style.backgroundImage = "url('" + bgUrl + "')";
      }

      busyTimer = setTimeout(function() {
        if (!isNexusDone && nexusBar) {
          nexusBar.classList.add('nexus-bar-busy');
        }
      }, 700);

      creepStartTimer = setTimeout(function() {
        if (isNexusDone) return;
        creepTimer = setInterval(function() {
          if (isNexusDone) {
            clearInterval(creepTimer);
            return;
          }
          if (nexusProgress < 99) {
            var remaining = 99 - nexusProgress;
            var step = Math.max(0.1, remaining * 0.04);
            nexusProgress = Math.min(99, nexusProgress + step);
            if (nexusBar) nexusBar.style.width = nexusProgress + '%';
          }
        }, 100);
      }, 2000);

      function updateNexusProgress(pct) {
        if (isNexusDone || !nexusBar) return;
        nexusProgress = Math.max(nexusProgress, Math.min(99, pct));
        nexusBar.style.width = nexusProgress + '%';
      }

      function completeNexusLoading() {
        if (isNexusDone) return;
        isNexusDone = true;
        if (busyTimer) clearTimeout(busyTimer);
        if (creepStartTimer) clearTimeout(creepStartTimer);
        if (creepTimer) clearInterval(creepTimer);
        if (nexusBar) {
          nexusBar.style.transition = 'width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
          nexusBar.style.width = '100%';
        }
        var canvas = document.querySelector("#unity-canvas");
        if (canvas) canvas.style.visibility = 'visible';

        setTimeout(function() {
          if (nexusOverlay) {
            nexusOverlay.style.transition = 'opacity 0.4s ease';
            nexusOverlay.style.opacity = '0';
            nexusOverlay.style.pointerEvents = 'none';
            setTimeout(function() {
              if (nexusOverlay && nexusOverlay.parentNode) {
                nexusOverlay.parentNode.removeChild(nexusOverlay);
              }
              nexusOverlay = null;
              nexusBar = null;
            }, 450);
          }
        }, 120);
      }

      let totalBytesLoaded = 0;
      const expectedTotalBytes = 92 * 1024 * 1024; // ~92MB total for split data and wasm files

      async function fetchWithProgress(url) {
        let response;
        try {
          response = await fetch(url);
          if (!response.ok) throw new Error('HTTP status ' + response.status);
        } catch (err) {
          // Fallback to CDN if local fetch fails
          console.warn('Local fetch failed for ' + url + ', trying CDN fallback...', err);
          const cdnBase = 'https://cdn.jsdelivr.net/gh/web-ports/spaceflight-simulator@main/';
          response = await fetch(cdnBase + url);
        }

        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          totalBytesLoaded += value.length;
          chunks.push(value);

          const pct = Math.min(70, Math.round((totalBytesLoaded / expectedTotalBytes) * 70));
          updateNexusProgress(pct);
        }

        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try {
          cache = await caches.open("sfs-cache");
          const cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            const blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }
        } catch (e) {}

        const buffers = await Promise.all(
          fileParts.map(part => fetchWithProgress(part))
        );
        const mergedBlob = new Blob(buffers);
        if (cache) {
          try {
            const response = new Response(mergedBlob);
            await cache.put(cacheKey, response);
          } catch(e) {}
        }
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        try {
          updateNexusProgress(15);
          const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(getParts("Build/sfsim.data", 1, 3), "sfsim.data"),
            mergeFiles(getParts("Build/sfsim.wasm", 1, 3), "sfsim.wasm"),
          ]);

          updateNexusProgress(72);

          const canvas = document.querySelector("#unity-canvas");
          const buildUrl = "Build";
          const loaderUrl = buildUrl + "/sfsim.loader.js";

          const config = {
            arguments: [],
            dataUrl: dataUrl,
            frameworkUrl: buildUrl + "/sfsim.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Stef Morojna",
            productName: "Spaceflight Simulator",
            productVersion: "1.6.00.16",
            showBanner: function() {}
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
          }

          const script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            if (typeof createUnityInstance !== 'function') {
              console.error('createUnityInstance not found');
              return;
            }

            createUnityInstance(canvas, config, (progress) => {
              const unityPct = 72 + Math.round(progress * 26);
              updateNexusProgress(unityPct);
            }).then((unityInstance) => {
              window.unityInstance = unityInstance;
              if (unityInstance.Module) {
                window.Module = unityInstance.Module;
                window.FS = unityInstance.Module.FS;
              }
              completeNexusLoading();
            }).catch((message) => {
              console.error('Unity instance error:', message);
              completeNexusLoading();
            });
          };
          script.onerror = () => {
            console.error('Failed to load sfsim.loader.js');
            completeNexusLoading();
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error('Spaceflight Simulator loading error:', err);
          completeNexusLoading();
        }
      })();

      // Safety fallback timeout
      setTimeout(() => {
        if (!isNexusDone) completeNexusLoading();
      }, 25000);
    })();
    </script>

    <!-- Universal Autosave & Restore Bridge for Spaceflight Simulator -->
    <script>
    (function() {
      var gameAliases = [
        'spaceflightsimulator',
        'sfs',
        'SpaceflightSimulator/sfs.html',
        'sfs.html',
        'bookmark_stash:SpaceflightSimulator/sfs.html',
        'bookmark_stash:sfs.html'
      ];

      function saveSnapshotDirectToDB(incomingData) {
        if (!incomingData) return;
        var incomingLs = incomingData.localStorage || {};
        var incomingFs = incomingData.fsData || null;
        var incomingIdb = incomingData.idbData || null;
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) return;
              var tx = db.transaction('gameSnapshots', 'readwrite');
              var store = tx.objectStore('gameSnapshots');
              var getReq = store.get(gameAliases[0]);
              getReq.onsuccess = function() {
                var existing = getReq.result || null;
                var existingData = (existing && existing.localStorage && typeof existing.localStorage === 'object') ? existing.localStorage : {};
                var incomingKeys = Object.keys(incomingLs);
                var existingKeys = Object.keys(existingData);

                var lsToSave = Object.assign({}, incomingLs);
                if (incomingKeys.length === 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData);
                } else if (incomingKeys.length > 0 && existingKeys.length > 0) {
                  lsToSave = Object.assign({}, existingData, incomingLs);
                }

                var fsToSave = (existing && existing.fsData) ? Object.assign({}, existing.fsData) : null;
                if (incomingFs && Object.keys(incomingFs).length > 0) {
                  fsToSave = Object.assign({}, fsToSave || {}, incomingFs);
                }

                var idbToSave = (existing && existing.idbData) ? Object.assign({}, existing.idbData) : null;
                if (incomingIdb && Object.keys(incomingIdb).length > 0) {
                  idbToSave = Object.assign({}, idbToSave || {}, incomingIdb);
                }

                var savedAt = Date.now();
                var history = Array.isArray(existing && existing.history) ? existing.history.slice(-4) : [];
                if (existing && (existing.localStorage || existing.fsData || existing.idbData)) {
                  history.push({
                    localStorage: existing.localStorage,
                    fsData: existing.fsData,
                    idbData: existing.idbData,
                    savedAt: existing.savedAt || savedAt
                  });
                }

                gameAliases.forEach(function(targetId) {
                  if (!targetId) return;
                  var record = {
                    gameId: targetId,
                    localStorage: lsToSave,
                    fsData: fsToSave,
                    idbData: idbToSave,
                    savedAt: savedAt,
                    history: history
                  };
                  try { store.put(record); } catch(err) {}
                });
              };
            } catch(txErr) {}
          };
        } catch(err) {}
      }

      function readSnapshotDirectFromDB(callback) {
        try {
          var req = indexedDB.open("GameStorageDB", 3);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            if (!d.objectStoreNames.contains('customGames')) d.createObjectStore('customGames', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('gameSnapshots')) d.createObjectStore('gameSnapshots', { keyPath: 'gameId' });
          };
          req.onsuccess = function(e) {
            var db = e.target.result;
            db.onversionchange = function() { try { db.close(); } catch(err) {} };
            try {
              if (!db.objectStoreNames.contains('gameSnapshots')) {
                if (callback) callback(null);
                return;
              }
              var tx = db.transaction('gameSnapshots', 'readonly');
              var store = tx.objectStore('gameSnapshots');
              var idx = 0;
              function checkNext() {
                if (idx >= gameAliases.length) {
                  if (callback) callback(null);
                  return;
                }
                var curId = gameAliases[idx++];
                var getReq = store.get(curId);
                getReq.onsuccess = function() {
                  var res = getReq.result;
                  if (res && (res.localStorage || res.fsData || res.idbData)) {
                    if (callback) callback(res);
                  } else {
                    checkNext();
                  }
                };
                getReq.onerror = function() { checkNext(); };
              }
              checkNext();
            } catch(txErr) {
              if (callback) callback(null);
            }
          };
          req.onerror = function() { if (callback) callback(null); };
        } catch(err) {
          if (callback) callback(null);
        }
      }

      function getFS() {
        return window.FS || (window.unityInstance && window.unityInstance.Module && window.unityInstance.Module.FS);
      }

      function sendSave() {
        try {
          var s = {};
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('tb_') !== 0) s[k] = localStorage.getItem(k);
          }
          var msg = { type: 'nexus-game-save', gameId: 'spaceflightsimulator', localStorage: s };
          saveSnapshotDirectToDB(msg);
          if (window.parent && window.parent !== window) {
            try { window.parent.postMessage(msg, '*'); } catch(e) {}
          }
          var opener = (window.parent && window.parent.opener) || window.opener;
          if (opener) {
            try { opener.postMessage(msg, '*'); } catch(e) {}
          }
        } catch(e) {}
      }

      function syncAndSend() {
        try {
          var fs = getFS();
          if (fs && typeof fs.syncfs === 'function') {
            fs.syncfs(false, function() { sendSave(); });
            return;
          }
        } catch(e) {}
        sendSave();
      }

      function applyRestore(data) {
        if (!data) return;
        if (data.localStorage && typeof data.localStorage === 'object') {
          Object.keys(data.localStorage).forEach(function(k) {
            if (k && k.indexOf('tb_') !== 0) localStorage.setItem(k, data.localStorage[k]);
          });
        }
        var fs = getFS();
        if (fs && typeof fs.syncfs === 'function') {
          try { fs.syncfs(true, function() {}); } catch(e) {}
        }
      }

      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'nexus-request-game-save') syncAndSend();
        if (e.data.type === 'nexus-apply-game-restore') applyRestore(e.data);
      });

      window.addEventListener('pagehide', syncAndSend, { passive: true });
      window.addEventListener('beforeunload', syncAndSend, { passive: true });
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) syncAndSend();
      }, { passive: true });
      setInterval(syncAndSend, 4000);

      // Proactively request restore from parent and opener, and load directly from IDB
      var reqMsg = { type: 'nexus-request-game-restore', gameId: 'spaceflightsimulator' };
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(reqMsg, '*'); } catch(e) {}
      }
      var opener = (window.parent && window.parent.opener) || window.opener;
      if (opener) {
        try { opener.postMessage(reqMsg, '*'); } catch(e) {}
      }
      readSnapshotDirectFromDB(function(snap) {
        if (snap) applyRestore(snap);
      });
    })();
    </script>
  </body>
</html>
