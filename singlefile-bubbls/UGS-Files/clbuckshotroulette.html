<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buckshot Roulette</title>
  <script>
    try {
      Object.defineProperty(navigator, 'language', { configurable: true, get: () => 'en-US' });
      Object.defineProperty(navigator, 'languages', { configurable: true, get: () => ['en-US', 'en'] });
    } catch (e) {}
  </script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090909; }
    *, *::before, *::after { box-sizing: border-box; }
    #unity-container { position: relative; width: 100%; height: 100%; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #090909; outline: none; }
    #loading-cover { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: #090909; }
    #unity-loading-bar { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(440px, 82vw); }
    #unity-progress-bar-empty { width: 100%; height: 16px; padding: 2px; border: 1px solid rgba(255,255,255,.8); border-radius: 8px; }
    #unity-progress-bar-full { width: 0; height: 100%; border-radius: 5px; background: #fff; transition: width .15s ease-out; }
    .spinner { width: 30px; height: 30px; border: 4px solid rgba(255,255,255,.22); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loading-cover" role="status" aria-label="Loading Buckshot Roulette">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    const buildUrl = 'https://cdn.jsdelivr.net/gh/vzl4/waitress-project@5752411a46a7615a8ddbca2806f9552aa4d04d14/app';
    const loaderUrl = buildUrl + '/loader.js';
    const config = {
      dataUrl: buildUrl + '/buck.data.br',
      frameworkUrl: buildUrl + '/model.js',
      codeUrl: buildUrl + '/buck.wasm.br',
      streamingAssetsUrl: buildUrl + '/sa/',
      companyName: 'Classroom 6x',
      productName: 'Buckshot Roulette',
      productVersion: '1.0',
      cacheControl: () => 'no-store',
      devicePixelRatio: navigator.deviceMemory && navigator.deviceMemory <= 4 ? 1 : (window.devicePixelRatio || 1)
    };
    // The CDN response is exposed to this frame as the raw Brotli payload,
    // despite its Content-Encoding header. Unity otherwise compiles the
    // compressed WASM bytes directly and fails the magic-number check. Decode
    // this game's Brotli assets before handing them to Unity.
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (input, init) => {
      const response = await nativeFetch(input, init);
      let assetPath = '';
      try {
        assetPath = new URL(response.url).pathname;
      } catch {}
      const isGameWasm = assetPath.endsWith('/buck.wasm.br');
      const isGameData = assetPath.endsWith('/buck.data.br');
      if ((!isGameWasm && !isGameData) || !response.ok || !response.body) return response;

      const unityDataSignature = new TextEncoder().encode('UnityWebData1.0');
      const probe = response.clone().body.getReader();
      const prefix = new Uint8Array(isGameWasm ? 4 : unityDataSignature.length);
      let prefixLength = 0;
      try {
        while (prefixLength < prefix.length) {
          const { value, done } = await probe.read();
          if (done) break;
          const take = Math.min(value.length, prefix.length - prefixLength);
          prefix.set(value.subarray(0, take), prefixLength);
          prefixLength += take;
        }
      } finally {
        probe.cancel().catch(() => {});
      }

      const wasmDecoded = isGameWasm && prefixLength === 4 &&
        prefix[0] === 0x00 && prefix[1] === 0x61 && prefix[2] === 0x73 && prefix[3] === 0x6d;
      const dataDecoded = isGameData && prefixLength === unityDataSignature.length &&
        unityDataSignature.every((byte, index) => prefix[index] === byte);
      const alreadyDecoded = wasmDecoded || dataDecoded;
      let body = response.body;
      if (!alreadyDecoded) {
        try {
          body = body.pipeThrough(new DecompressionStream('brotli'));
        } catch (error) {
          console.error('Buckshot Roulette Brotli decompression is unavailable:', error);
          return response;
        }
      }

      const headers = new Headers(response.headers);
      headers.delete('content-encoding');
      headers.delete('content-length');
      headers.set('content-type', isGameWasm ? 'application/wasm' : 'application/octet-stream');
      return new Response(body, {
        status: response.status,
        statusText: response.statusText,
        headers
      });
    };
    const canvas = document.querySelector('#unity-canvas');
    const loadingCover = document.querySelector('#loading-cover');
    const progressBarFull = document.querySelector('#unity-progress-bar-full');
    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        progressBarFull.style.width = `${100 * progress}%`;
      }).then(() => {
        loadingCover.style.display = 'none';
      }).catch(error => {
        console.error('Buckshot Roulette failed to initialize:', error);
      });
    };
    script.onerror = () => console.error('Buckshot Roulette loader failed to download.');
    canvas.addEventListener('pointerdown', () => window.focus());
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.appendChild(script)));
  </script>
</body>
</html>
