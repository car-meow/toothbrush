<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Chat</title>
    <link rel="stylesheet" href="style.css?v=54">
    <script src="bgm-manager.js?v=55"></script>
    <script>
        (function() {
            try {
                const storage = window.nexusStorage || window.localStorage;
                const theme = storage.getItem('tb_theme') || 'dark';
                if (theme === 'light') document.documentElement.classList.add('light-mode');
                if (storage.getItem('tb_performance_mode') === 'true') {
                    document.documentElement.classList.add('performance-mode');
                }
            } catch(e) {}
        })();
    </script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        if (typeof mqtt === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"><\/script>');
        }
    </script>
    <style>
        .status-header { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; font-size: 11px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .online-stats { display: flex; align-items: center; gap: 10px; margin-left: 15px; }
        .online-count { color: white; font-weight: bold; font-size: 16px; }
        .online-hint { color: #777; font-weight: bold; font-size: 10px; }

        .chat-msg {
            padding: 12px 18px; border-radius: 15px; background: rgba(0,0,0,0.6);
            border: 2.5px solid; max-width: 80%; margin-bottom: 12px; color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            word-break: break-word; overflow-wrap: anywhere;
        }

        .list-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 500px; background: var(--modal-bg); border: 2px solid var(--border-color);
            padding: 25px; border-radius: 20px; z-index: 5000; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            color: var(--text-color);
        }
        .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px; }
        .user-pill { padding: 8px 15px; border-radius: 8px; color: white; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); flex: 1; margin-right: 10px; }
        .ip-text { font-family: monospace; color: #aaa; font-size: 11px; margin-left: 10px; }
        
        .pin-input-large { font-size: 28px; text-align: center; letter-spacing: 5px; background: var(--input-bg); border: 2px solid var(--border-color); color: var(--text-color); width: 100%; border-radius: 12px; padding: 15px; outline: none; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
		
        #pin-wrapper { position: relative; display: inline-block; cursor: pointer; user-select: none; padding: 0 5px; min-width: 130px; text-align: center; }
        #pin-cover {
            position: absolute; top: -4px; left: 0; right: 0; bottom: -4px;
            background-color: var(--panel-bg); color: var(--text-color); font-size: 10px; font-weight: bold;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.15s ease-in-out; opacity: 1;
        }
        #pin-wrapper.revealed #pin-cover { opacity: 0; }

        /* Waiting overlay */
        #waiting-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 9000; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
        }
        #waiting-overlay p { color: #fff; font-size: 1.2rem; font-weight: bold; }
        .spinner { width: 48px; height: 48px; border: 5px solid #444; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="prefetch" href="index.html">
    <link rel="prefetch" href="cookie-engine.js">
    <link rel="prefetch" href="cookie-core.js">
</head>
<body class="chat-bg">
    <div id="page-fade-overlay"></div>
    <script>
        (function() {
            const overlay = document.getElementById('page-fade-overlay');
            window.navigateWithFade = function(url) {
                if (overlay) {
                    overlay.classList.remove('fade-out');
                    setTimeout(() => { location.href = url; }, 370);
                } else {
                    location.href = url;
                }
            };
            document.addEventListener('DOMContentLoaded', function() {
                if (overlay) overlay.classList.add('fade-out');
            });
        })();
    </script>

    <!-- Waiting spinner for guests -->
    <div id="waiting-overlay">
        <div class="spinner"></div>
        <p>Connecting — assigning your username…</p>
    </div>

    <header>
        <h1 onclick="navigateWithFade('index.html')" style="cursor:pointer">Nexus Chat</h1>
        
        <div class="status-header">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Network Offline</span>
        </div>

        <div id="stats-area" class="online-stats" style="display:none;">
            <span class="online-count"><span id="count-num">1</span> Online</span>
            <span class="online-hint">Ctrl+Shift+L to view list</span>
        </div>

        <div id="room-header-info" style="display:none; font-weight:bold; margin-left: 20px;">
            <span id="display-room-name"></span> | 
            <span id="pin-wrapper">
                <span id="display-pin"></span>
                <span id="pin-cover">Click to Show/Hide PIN</span>
            </span>
        </div>

        <div class="controls">
            <button id="reroll-btn" class="material-nav-btn" style="--expanded-width: 225px; display:none;">
                <img src="Assets/Rename.svg" alt=""><span>Re-Roll Username</span>
            </button>
            <button id="disband-btn" class="material-nav-btn" style="--expanded-width: 145px; display:none;">
                <img src="Assets/Delete.svg" alt=""><span>Disband</span>
            </button>
            <button id="chat-back-btn" onclick="navigateWithFade('index.html')" class="material-nav-btn" style="--expanded-width: 125px;">
                <img src="Assets/media-back-arrow.svg" alt=""><span>Home</span>
            </button>
        </div>
    </header>

    <main id="chat-home" style="display:flex; align-items:center; justify-content:center; flex:1;">
        <div class="modal-box" style="padding:40px; border-radius:25px; border:2px solid var(--white-outline); text-align:center; width:380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <h2 id="pin-header-title" style="margin-top:0; margin-bottom:20px; color:var(--title-color);">Enter PIN</h2>
            <input type="text" id="pin-entry" class="pin-input-large" placeholder="------" maxlength="6">
            <div id="pin-error" style="color:#f44336; margin-top:10px; margin-bottom:15px; display:none; font-weight:bold;">Host Offline or Incorrect PIN!</div>
            
            <button id="join-btn" class="save-btn" style="background:#2E7D32; width:100%; height:55px; font-size:18px; margin-top: 15px;">Join Room</button>
            <div style="margin:25px 0; color:var(--muted-text, #888); font-weight:bold;">OR</div>
            <button id="open-host-panel" class="save-btn" style="width:100%;">Host New Room</button>
        </div>
    </main>

    <div id="host-modal" class="overlay" style="z-index: 30000;">
        <div class="modal-box" style="padding:35px; border-radius:20px; width:350px; border:2px solid var(--white-outline); text-align:center;">
            <h3 style="margin-top:0; margin-bottom:20px; color:var(--title-color);">Host Room</h3>
            <input type="text" id="host-name-input" placeholder="Room Name" class="pin-input-large" style="width:100%; margin-top:15px; font-size:18px; letter-spacing:0;">
            <input type="text" id="host-pin-input" placeholder="6-Digit PIN" maxlength="6" class="pin-input-large" style="width:100%; margin-top:10px;">
            
            <button id="start-host-btn" class="save-btn" style="background:#2E7D32; width:100%; height:50px; margin-top:15px;">Go Live</button>
            <button onclick="document.getElementById('host-modal').style.display='none'" class="save-btn cancel-modal-btn" style="width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <main id="chat-room" style="display:none; flex-direction:column; flex:1; height: calc(100vh - 70px);">
        <div id="messages" style="flex:1; overflow-y:auto; padding:30px; display:flex; flex-direction:column;"></div>
        <div style="padding:20px; background: var(--panel-bg-alt); display:flex; gap:12px; border-top:1px solid var(--border-color); align-items:center;">
            <label for="img-upload" class="save-btn" style="background:#1e3a8a; padding:0; width:50px; height:50px; border-radius:12px; flex-shrink:0;" title="Upload Photo">
                <img src="Assets/photoIcon.png" alt="Photos" style="width:24px; height:24px; object-fit:contain;">
            </label>
            <input type="file" id="img-upload" accept="image/*" style="display:none;">
            <input type="text" id="msg-input" placeholder="Type a message..." style="flex:1; background: var(--input-bg); border:1px solid var(--border-color); color: var(--text-color); padding:15px; border-radius:12px; outline:none;">
            <button id="send-btn" class="save-btn" style="background:#2E7D32; padding: 12px 30px; border-radius: 12px; height: 50px;">Send</button>
        </div>
    </main>

    <div id="user-list-modal" class="list-modal">
        <h3 id="modal-title">Active Users</h3>
        <div id="list-content" style="margin-top:15px; max-height:300px; overflow-y:auto;"></div>
        <button onclick="this.parentElement.style.display='none'" class="save-btn" style="width:100%; margin-top:15px; background:#444;">Close</button>
    </div>

    <script>
        const localStorage = window.nexusStorage;
        document.addEventListener('DOMContentLoaded', async () => {

        // ═══════════════════════════════════════════════════
        //  0.  BAN CHECK
        // ═══════════════════════════════════════════════════
        const timeoutEnd = localStorage.getItem('tb_chat_timeout');
        if (timeoutEnd && Date.now() < parseInt(timeoutEnd)) {
            const timeLeft = Math.ceil((parseInt(timeoutEnd) - Date.now()) / 1000);
            await nexusAlert(`You are currently in a timeout from being kicked. Please wait ${timeLeft} seconds.`);
            navigateWithFade('index.html'); return;
        } else if (timeoutEnd) { localStorage.removeItem('tb_chat_timeout'); }

        // ═══════════════════════════════════════════════════
        //  1.  USERNAME POOL  (100 animal-based names)
        // ═══════════════════════════════════════════════════
        const USERNAME_POOL = [
            "Red Fox","Blue Whale","Green Gecko","Black Panther","White Wolf",
            "Silver Hawk","Golden Eagle","Crimson Cobra","Violet Viper","Orange Otter",
            "Yellow Yak","Pink Flamingo","Gray Gorilla","Brown Bear","Cyan Cheetah",
            "Indigo Iguana","Scarlet Sparrow","Amber Antelope","Jade Jaguar","Ivory Owl",
            "Teal Tiger","Bronze Buffalo","Ruby Raven","Sapphire Shark","Emerald Elk",
            "Lavender Lynx","Coral Crow","Onyx Octopus","Pearl Penguin","Copper Cougar",
            "Mint Mongoose","Navy Narwhal","Maroon Moose","Turquoise Turtle","Magenta Mantis",
            "Charcoal Chameleon","Lime Leopard","Plum Panda","Gold Gazelle","Azure Alligator",
            "Crimson Crane","Silver Snake","White Weasel","Black Badger","Green Falcon",
            "Blue Bison","Orange Orca","Red Rabbit","Yellow Zebra","Purple Parrot",
            "Gray Gator","Brown Bat","Cyan Camel","Indigo Impala","Scarlet Scorpion",
            "Amber Ape","Jade Jellyfish","Ivory Ibex","Teal Tortoise","Bronze Beetle",
            "Ruby Raccoon","Sapphire Seal","Emerald Eel","Lavender Lizard","Coral Cat",
            "Onyx Owl","Pearl Puma","Copper Crab","Mint Macaw","Navy Newt",
            "Maroon Moth","Turquoise Toucan","Magenta Monkey","Charcoal Cheetah","Lime Lemur",
            "Plum Pigeon","Gold Gibbon","Azure Axolotl","Crimson Capybara","Silver Sloth",
            "White Walrus","Black Bison","Green Gorilla","Blue Beetle","Orange Ocelot",
            "Red Rhino","Yellow Yeti","Purple Platypus","Gray Grouse","Brown Boar",
            "Cyan Condor","Indigo Ibis","Scarlet Stork","Amber Armadillo","Jade Jackal",
            "Ivory Impala","Teal Tapir","Bronze Boar","Ruby Rooster","Sapphire Skunk"
        ];

        // ── Color prefix → hex  (matches the color word in each name) ──
        const COLOR_PREFIX_MAP = {
            "Red":       "#F44336",
            "Blue":      "#42A5F5",
            "Green":     "#66BB6A",
            "Black":     "#90A4AE",   // lightened so it's visible on dark bg
            "White":     "#E0E0E0",
            "Silver":    "#B0BEC5",
            "Golden":    "#FFD54F",
            "Crimson":   "#DC143C",
            "Violet":    "#B388FF",
            "Orange":    "#FFA726",
            "Yellow":    "#FFEE58",
            "Pink":      "#F48FB1",
            "Gray":      "#BDBDBD",
            "Brown":     "#A1887F",
            "Cyan":      "#26C6DA",
            "Indigo":    "#7986CB",
            "Scarlet":   "#FF5252",
            "Amber":     "#FFD740",
            "Jade":      "#00BFA5",
            "Ivory":     "#FFF8E1",
            "Teal":      "#26A69A",
            "Bronze":    "#CD7F32",
            "Ruby":      "#E91E63",
            "Sapphire":  "#448AFF",
            "Emerald":   "#00E676",
            "Lavender":  "#CE93D8",
            "Coral":     "#FF8A65",
            "Onyx":      "#78909C",   // lightened
            "Pearl":     "#E8E0D0",
            "Copper":    "#D4A373",
            "Mint":      "#69F0AE",
            "Navy":      "#5C6BC0",
            "Maroon":    "#C62828",
            "Turquoise": "#4DD0E1",
            "Magenta":   "#F06292",
            "Charcoal":  "#90A4AE",   // lightened
            "Lime":      "#C6FF00",
            "Plum":      "#BA68C8",
            "Gold":      "#FFD700",
            "Azure":     "#2979FF",
            "Purple":    "#AB47BC"
        };

        function colorForName(username) {
            const prefix = username.split(' ')[0];
            return COLOR_PREFIX_MAP[prefix] || '#FFFFFF';
        }

        // ═══════════════════════════════════════════════════
        //  2.  STATE
        // ═══════════════════════════════════════════════════
        let mqttClient    = null;
        let currentTopic  = null;
        let isHost        = false;
        let isDisconnecting = false;
        let hostWaitTimeout = null;
        let isModalAdmin  = false;

        const myUuid = Math.random().toString(36).substr(2, 9);
        let myName  = null;   // assigned after host acknowledges
        let myColor = null;

        // Host bookkeeping
        let registry  = {};          // peerId → { name, color, ip, peerId }
        let usedNames = new Set();   // names currently assigned

        // Everyone's view
        let globalUserList = [];

        // Buffer in case room-info arrives before name-assign
        let pendingRoomInfo = null;
        let uiReady = false;

        let myIP = "Hidden";
        (async () => {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.ip) myIP = data.ip;
                }
            } catch(e) {}
        })();

        // Same topic-version scheme as the original codebase
        const VERSION = "tb-wss-v5-";

        // ═══════════════════════════════════════════════════
        //  3.  HELPERS
        // ═══════════════════════════════════════════════════
        function setStatus(type, text) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if (!dot || !txt) return;
            txt.textContent = text;
            dot.style.background = type === 'ready' ? '#4CAF50' : type === 'loading' ? '#FFEB3B' : '#f44336';
            dot.style.boxShadow  = type === 'ready' ? '0 0 10px #4CAF50' : 'none';
        }

        function showWaiting(v) { document.getElementById('waiting-overlay').style.display = v ? 'flex' : 'none'; }

        function publish(data) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(currentTopic, JSON.stringify(data), { qos: 1 });
            }
        }

        function pickFreeName() {
            const available = USERNAME_POOL.filter(n => !usedNames.has(n));
            if (available.length === 0) return USERNAME_POOL[Math.floor(Math.random() * USERNAME_POOL.length)];
            return available[Math.floor(Math.random() * available.length)];
        }

        function broadcastRegistry() {
            const list = Object.values(registry);
            publish({ type: 'registry-sync', list });
        }

        function updateOccupancy() {
            document.getElementById('count-num').textContent = globalUserList.length;
            refreshModalIfOpen();
        }

        // ═══════════════════════════════════════════════════
        //  4.  USER LIST MODAL
        // ═══════════════════════════════════════════════════
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) { e.preventDefault(); openUserModal(false); }
            if (e.ctrlKey && e.shiftKey && (e.key === '0' || e.key === ')')) { e.preventDefault(); openUserModal(true); }

            const hostModal = document.getElementById('host-modal');
            const userListModal = document.getElementById('user-list-modal');
            if (e.key === 'Escape') {
                if (hostModal.style.display === 'flex') { e.preventDefault(); hostModal.style.display = 'none'; }
                if (userListModal.style.display === 'block') { e.preventDefault(); userListModal.style.display = 'none'; }
            }
            if (e.key === 'Enter') {
                if (hostModal.style.display === 'flex') { e.preventDefault(); document.getElementById('start-host-btn').click(); }
                else if (userListModal.style.display === 'block') { e.preventDefault(); userListModal.style.display = 'none'; }
            }
        });

        function openUserModal(isAdmin) {
            isModalAdmin = isAdmin;
            const modal = document.getElementById('user-list-modal');
            const list  = document.getElementById('list-content');
            document.getElementById('modal-title').textContent = isAdmin ? 'Admin Backdoor (IPs)' : 'Active Users';
            list.innerHTML = '';

            globalUserList.forEach(user => {
                const row = document.createElement('div');
                row.className = 'user-row';
                let html = `<div class="user-pill" style="background:${user.color}">${user.name}</div>`;
                if (isAdmin) html += `<span class="ip-text">${user.ip}</span>`;
                if (isHost && user.peerId !== myUuid) {
                    html += `<span onclick="kickById('${user.peerId}','${user.name}')" style="cursor:pointer"><img src="Assets/Delete.svg" alt="Kick" style="width:18px;height:18px;filter:brightness(0) invert(1);vertical-align:middle;"></span>`;
                }
                row.innerHTML = html;
                list.appendChild(row);
            });
            modal.style.display = 'block';
        }

        function refreshModalIfOpen() {
            if (document.getElementById('user-list-modal').style.display === 'block') openUserModal(isModalAdmin);
        }

        document.getElementById('pin-wrapper').onclick = function() { this.classList.toggle('revealed'); };

        // ═══════════════════════════════════════════════════
        //  5.  NETWORK — CONNECT
        // ═══════════════════════════════════════════════════
        document.getElementById('open-host-panel').onclick = () => {
            const hostModal = document.getElementById('host-modal');
            if (hostModal) {
                hostModal.style.display = 'flex';
                const pinInput = document.getElementById('host-pin-input');
                if (pinInput && !pinInput.value) {
                    pinInput.value = Math.floor(100000 + Math.random() * 900000).toString();
                }
            }
        };

        document.getElementById('start-host-btn').onclick = () => {
            const nameInput = document.getElementById('host-name-input');
            const pinInput = document.getElementById('host-pin-input');
            const name = (nameInput && nameInput.value ? nameInput.value.trim() : '') || 'Nexus Room';
            let pin = (pinInput && pinInput.value ? pinInput.value.trim() : '');
            if (!pin || pin.length !== 6 || isNaN(pin)) {
                pin = Math.floor(100000 + Math.random() * 900000).toString();
                if (pinInput) pinInput.value = pin;
            }
            isHost = true;
            startNetwork(pin, name);
        };

        document.getElementById('join-btn').onclick = () => {
            const pinEntry = document.getElementById('pin-entry');
            const pin = (pinEntry && pinEntry.value ? pinEntry.value.trim() : '');
            const pinErr = document.getElementById('pin-error');
            if (!pin || pin.length !== 6 || isNaN(pin)) {
                if (pinErr) {
                    pinErr.textContent = 'Please enter a valid 6-digit PIN.';
                    pinErr.style.display = 'block';
                }
                return;
            }
            if (pinErr) pinErr.style.display = 'none';
            isHost = false;
            startNetwork(pin, null);
        };

        function startNetwork(pin, roomName) {
            setStatus('loading', 'Connecting to secure relay…');
            if (mqttClient) {
                try { mqttClient.end(true); } catch(e) {}
            }

            if (typeof mqtt === 'undefined') {
                setStatus('error', 'Relay Library Offline');
                if (window.nexusAlert) nexusAlert('Network relay library is loading or blocked by your browser network. Please refresh or check connection.');
                return;
            }

            currentTopic = VERSION + pin;

            // MQTT Last-Will-and-Testament: broker auto-publishes this when
            // our connection drops (tab close, network loss, etc.)
            const willPayload = isHost
                ? { type: 'disband' }
                : { type: 'leave', peerId: myUuid };

            try {
                mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    keepalive: 30,
                    reconnectPeriod: 3000,
                    will: {
                        topic:   currentTopic,
                        payload: JSON.stringify(willPayload),
                        qos: 1,
                        retain: false
                    }
                });
            } catch(e) {
                setStatus('error', 'Connection Error');
                return;
            }

            mqttClient.on('connect', () => {
                mqttClient.subscribe(currentTopic, { qos: 1 }, (err) => {
                    if (err) return;

                    if (isHost) {
                        // ── Host: assign self a name from the pool ──
                        myName  = pickFreeName();
                        myColor = colorForName(myName);
                        usedNames.add(myName);

                        registry[myUuid] = { name: myName, color: myColor, ip: myIP, peerId: myUuid };
                        globalUserList = Object.values(registry);

                        setStatus('ready', 'Room Live');
                        updateOccupancy();
                        setupUI(roomName, pin);
                    } else {
                        // ── Guest: ask to join ──
                        showWaiting(true);
                        setStatus('loading', 'Locating Host…');
                        publish({ type: 'join', peerId: myUuid, ip: myIP });

                        hostWaitTimeout = setTimeout(() => {
                            if (!myName) {
                                showWaiting(false);
                                setStatus('error', 'Host Offline');
                                document.getElementById('pin-error').style.display = 'block';
                                if (mqttClient) mqttClient.end(true);
                            }
                        }, 8000);
                    }
                });
            });

            mqttClient.on('message', (topic, message) => {
                try { handleData(JSON.parse(message.toString())); } catch(e) {}
            });

            mqttClient.on('error', () => { setStatus('error', 'Network Blocked'); showWaiting(false); });
        }

        // ═══════════════════════════════════════════════════
        //  6.  MESSAGE HANDLER
        // ═══════════════════════════════════════════════════
        function handleData(data) {

            // ─── HOST: incoming join ─────────────────────────
            if (isHost && data.type === 'join' && data.peerId !== myUuid) {
                if (registry[data.peerId]) {
                    // Already in room — re-send state in case they missed it
                    publish({ type: 'name-assign', targetPeerId: data.peerId, name: registry[data.peerId].name, color: registry[data.peerId].color });
                    publish({ type: 'room-info', name: document.getElementById('display-room-name').textContent, pin: document.getElementById('display-pin').textContent });
                    broadcastRegistry();
                    return;
                }

                const assignedName  = pickFreeName();
                const assignedColor = colorForName(assignedName);
                usedNames.add(assignedName);
                registry[data.peerId] = { name: assignedName, color: assignedColor, ip: data.ip, peerId: data.peerId };
                globalUserList = Object.values(registry);

                // Send assignment FIRST, then room-info, then full registry
                publish({ type: 'name-assign', targetPeerId: data.peerId, name: assignedName, color: assignedColor });

                // Small delay to help ordering on the broker
                setTimeout(() => {
                    publish({ type: 'room-info', name: document.getElementById('display-room-name').textContent, pin: document.getElementById('display-pin').textContent });
                    broadcastRegistry();
                    appendSystemMessage(`${assignedName} joined.`);
                    publish({ type: 'msg', name: 'System', color: '#777', text: `${assignedName} joined.` });
                    updateOccupancy();
                }, 100);
            }

            // ─── GUEST: receive name assignment ──────────────
            if (!isHost && data.type === 'name-assign' && data.targetPeerId === myUuid) {
                if (hostWaitTimeout) { clearTimeout(hostWaitTimeout); hostWaitTimeout = null; }
                myName  = data.name;
                myColor = data.color;
                showWaiting(false);
                setStatus('ready', 'Joined Room');
                // If room-info already arrived, apply it now
                if (pendingRoomInfo && !uiReady) {
                    setupUI(pendingRoomInfo.name, pendingRoomInfo.pin);
                }
            }

            // ─── GUEST: room-info ────────────────────────────
            if (!isHost && data.type === 'room-info') {
                if (myName && !uiReady) {
                    setupUI(data.name, data.pin);
                } else if (!myName) {
                    // Buffer until we have a name
                    pendingRoomInfo = { name: data.name, pin: data.pin };
                }
            }

            // ─── Everyone: registry sync ─────────────────────
            if (data.type === 'registry-sync') {
                if (hostWaitTimeout) { clearTimeout(hostWaitTimeout); hostWaitTimeout = null; }
                globalUserList = data.list;
                updateOccupancy();
                if (!isHost && myName) setStatus('ready', 'Joined Room');
            }

            // ─── Regular chat message ────────────────────────
            if (data.type === 'msg' && data.name !== myName) {
                appendMessage(data.name, data.color, data.text, data.uuid || data.name);
            }

            // ─── Disband ─────────────────────────────────────
            if (data.type === 'disband') {
                if (isDisconnecting) return;
                isDisconnecting = true;
                // Removed redundant alert to avoid double prompt
                location.reload();
            }

            // ─── Kick ────────────────────────────────────────
            if (data.type === 'kick') {
                if (isHost) {
                    appendSystemMessage(`${data.targetName} was kicked from the room.`);
                    publish({ type: 'msg', name: 'System', color: '#777', text: `${data.targetName} was kicked from the room.` });
                }
                if (data.targetPeerId === myUuid) {
                    if (isDisconnecting) return;
                    isDisconnecting = true;
                    localStorage.setItem('tb_chat_timeout', Date.now() + 60000);
                    await nexusAlert('You have been kicked! You are timed out for 1 minute.');
                    navigateWithFade('index.html');
                }
            }

            // ─── HOST: member leave ──────────────────────────
            if (isHost && data.type === 'leave' && data.peerId !== myUuid) {
                const departed = registry[data.peerId];
                if (departed) {
                    usedNames.delete(departed.name);
                    delete registry[data.peerId];
                    globalUserList = Object.values(registry);
                    appendSystemMessage(`${departed.name} left the room.`);
                    publish({ type: 'msg', name: 'System', color: '#777', text: `${departed.name} left.` });
                    updateOccupancy();
                    broadcastRegistry();
                }
            }

            // ─── Name change (re-roll) ───────────────────────
            if (data.type === 'name-change') {
                appendSystemMessage(`${data.oldName} changed their name to ${data.newName}`);
                updateMessagesInUI(data.uuid, data.newName, data.newColor);
                if (isHost && data.peerId !== myUuid) {
                    const entry = registry[data.peerId];
                    if (entry) {
                        usedNames.delete(entry.name);
                        entry.name  = data.newName;
                        entry.color = data.newColor;
                        usedNames.add(data.newName);
                        broadcastRegistry();
                    }
                }
            }
        }

        // ═══════════════════════════════════════════════════
        //  7.  UI SETUP
        // ═══════════════════════════════════════════════════
        function setupUI(name, pin) {
            if (uiReady) return;   // prevent double-init
            uiReady = true;
            pendingRoomInfo = null;

            document.getElementById('chat-home').style.display = 'none';
            document.getElementById('host-modal').style.display = 'none';
            document.getElementById('chat-room').style.display  = 'flex';
            document.getElementById('room-header-info').style.display = 'block';
            document.getElementById('stats-area').style.display = 'flex';
            document.getElementById('reroll-btn').style.display = 'inline-flex';
            document.getElementById('display-room-name').textContent = name;
            document.getElementById('display-pin').textContent = pin;
            document.getElementById('pin-wrapper').classList.remove('revealed');

            const backBtn = document.getElementById('chat-back-btn');
            if (isHost) {
                document.getElementById('disband-btn').style.display = 'inline-flex';
                if (backBtn) backBtn.style.display = 'none';
            } else {
                if (backBtn && backBtn.querySelector('span')) backBtn.querySelector('span').textContent = 'Leave';
            }
        }

        // ═══════════════════════════════════════════════════
        //  8.  MESSAGE RENDERING
        // ═══════════════════════════════════════════════════
        function appendSystemMessage(text) {
            const area = document.getElementById('messages');
            const div  = document.createElement('div');
            div.style.cssText = 'color:#777;font-weight:bold;text-align:center;margin:10px 0;font-size:12px;';
            div.textContent = text;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        function updateMessagesInUI(uuid, newName, newColor) {
            const safe = (uuid || '').replace(/[^a-zA-Z0-9_-]/g, '_');
            document.querySelectorAll(`.msg-uuid-${safe}`).forEach(el => {
                el.style.borderColor = newColor;
                const tag = el.querySelector('.name-tag');
                if (tag) { tag.textContent = newName; tag.style.color = newColor; }
            });
        }

        function appendMessage(name, color, text, uuid) {
            const area = document.getElementById('messages');
            const div  = document.createElement('div');
            const safe = (uuid || name || '').replace(/[^a-zA-Z0-9_-]/g, '_');
            div.className   = `chat-msg msg-uuid-${safe}`;
            div.style.borderColor = color;
            div.style.alignSelf   = (name === myName) ? 'flex-end' : 'flex-start';
            div.innerHTML = `<div class="name-tag" style="font-size:10px;font-weight:bold;color:${color};margin-bottom:4px;">${name}</div><div>${text}</div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        // ═══════════════════════════════════════════════════
        //  9.  SEND / INPUT
        // ═══════════════════════════════════════════════════
        document.getElementById('send-btn').onclick = () => {
            const val = document.getElementById('msg-input').value.trim();
            if (!val || !myName) return;
            appendMessage(myName, myColor, val, myUuid);
            publish({ type: 'msg', name: myName, color: myColor, text: val, uuid: myUuid });
            document.getElementById('msg-input').value = '';
        };

        document.getElementById('msg-input').onkeypress  = (e) => { if (e.key === 'Enter') document.getElementById('send-btn').click(); };
        document.getElementById('pin-entry').onkeypress   = (e) => { if (e.key === 'Enter') document.getElementById('join-btn').click(); };

        // ═══════════════════════════════════════════════════
        //  10. IMAGE UPLOAD
        // ═══════════════════════════════════════════════════
        document.getElementById('img-upload').onchange = function(e) {
            const file = e.target.files[0];
            if (!file || !myName) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const MAX = 400;
                    if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                    else if (h > MAX) { w *= MAX / h; h = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const b64 = canvas.toDataURL('image/jpeg', 0.6);
                    const tag = `<img src="${b64}" style="max-width:100%;border-radius:8px;margin-top:5px;cursor:pointer;" onclick="window.open(this.src)">`;
                    appendMessage(myName, myColor, tag, myUuid);
                    publish({ type: 'msg', name: myName, color: myColor, text: tag, uuid: myUuid });
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            this.value = '';
        };

        // ═══════════════════════════════════════════════════
        //  11. DISBAND / KICK / RE-ROLL
        // ═══════════════════════════════════════════════════
        document.getElementById('disband-btn').onclick = async () => {
            const ok = await nexusConfirm('Disband Room?');
            if (ok) {
                if (isDisconnecting) return;
                isDisconnecting = true;
                publish({ type: 'disband' });
                await nexusAlert('Room Disbanded.');
                setTimeout(() => location.reload(), 500);
            }
        };

        window.kickById = (targetPeerId, targetName) => {
            publish({ type: 'kick', targetPeerId, targetName });
            if (registry[targetPeerId]) {
                usedNames.delete(registry[targetPeerId].name);
                delete registry[targetPeerId];
            }
            globalUserList = Object.values(registry);
            updateOccupancy();
            broadcastRegistry();
        };

        // Re-Roll: pick a new unused name from the pool
        let rerollCooldown = false;
        document.getElementById('reroll-btn').onclick = async () => {
            if (rerollCooldown) return nexusAlert('You must wait 3 minutes between name changes.');
            if (!myName) return;

            // Figure out which names are in use
            const inUse = new Set(globalUserList.map(u => u.name));
            const available = USERNAME_POOL.filter(n => !inUse.has(n));
            if (available.length === 0) return nexusAlert('No usernames available right now.');

            const oldName  = myName;
            const newName  = available[Math.floor(Math.random() * available.length)];
            const newColor = colorForName(newName);

            // If host, update own registry entry
            if (isHost) {
                usedNames.delete(oldName);
                usedNames.add(newName);
                if (registry[myUuid]) { registry[myUuid].name = newName; registry[myUuid].color = newColor; }
                globalUserList = Object.values(registry);
            }

            myName  = newName;
            myColor = newColor;

            appendSystemMessage(`${oldName} changed their name to ${myName}`);
            updateMessagesInUI(myUuid, myName, myColor);
            publish({ type: 'name-change', oldName, newName: myName, newColor: myColor, uuid: myUuid, peerId: myUuid });

            rerollCooldown = true;
            const btn = document.getElementById('reroll-btn');
            btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed';
            if (btn.querySelector('span')) btn.querySelector('span').textContent = 'Cooldown (3m)';
            setTimeout(() => {
                rerollCooldown = false;
                btn.style.opacity = '1'; btn.style.cursor = 'pointer';
                if (btn.querySelector('span')) btn.querySelector('span').textContent = 'Re-Roll Username';
            }, 180000);
        };

        // ═══════════════════════════════════════════════════
        //  12. LEAVE ON UNLOAD (backup — LWT handles crashes)
        // ═══════════════════════════════════════════════════
        window.addEventListener('beforeunload', () => {
            if (isDisconnecting) return;
            isDisconnecting = true;
            if (mqttClient && mqttClient.connected) {
                if (isHost) publish({ type: 'disband' });
                else        publish({ type: 'leave', peerId: myUuid, name: myName });
            }
        });

        // Misc
        document.getElementById('pin-entry').oninput = () => {
            document.getElementById('pin-entry').style.color = 'white';
            document.getElementById('pin-error').style.display = 'none';
        };

        // Fade page in
        const overlay = document.getElementById('page-fade-overlay');
        if (overlay) overlay.classList.add('fade-out');
    });
    </script>
    <script src="tutorial-engine.js?v=1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.TutorialEngine) TutorialEngine.initChat();
        });
    </script>
</body>
