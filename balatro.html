<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro</title>

  <!-- Base URL pointing to the static assets host -->
  <base href="https://cdn.jsdelivr.net/gh/55gms/55gms@master/static/misc/balatro/">
  <link rel="stylesheet" type="text/css" href="theme/love.css">
  <script src="consolewrapper.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0e0e10;
    }
    #loadingCanvas, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    #canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    #nexus-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background-color: #050505;
      background: radial-gradient(circle at 50% 40%, #1a1a24 0%, #08080c 70%, #000000 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .nexus-loader-bar-container {
      width: clamp(260px, 36vw, 440px);
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: clamp(60px, 12vh, 100px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .nexus-loader-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #ffffff;
      border-radius: 10px;
      transition: width 0.2s ease-out;
    }
    @keyframes nexus-stripes-backward {
      0% { background-position: 56px 0; }
      100% { background-position: 0 0; }
    }
    .nexus-bar-busy {
      background-image: repeating-linear-gradient(
        -45deg,
        #ffffff 0px,
        #ffffff 14px,
        #a8a8a8 14px,
        #a8a8a8 28px
      ) !important;
      background-size: 39.6px 100% !important;
      animation: nexus-stripes-backward 0.75s linear infinite !important;
    }
  </style>
</head>
<body>
  <div id="nexus-loading-screen">
    <div class="nexus-loader-bar-container">
      <div id="nexus-loader-bar" class="nexus-loader-bar-fill"></div>
    </div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script type='text/javascript'>
    if (window.parent !== window.self) {
      try { window.parent.postMessage("bonk", "*"); } catch(e) {}
    }

    // Universal Instant Ad Reward Bypass Engine
    window.PokiSDK = window.PokiSDK || {
      init: function() { return Promise.resolve(); },
      commercialBreak: function() { return Promise.resolve(); },
      rewardedBreak: function(fn) { if (typeof fn === 'function') try { fn(true); } catch(e) {} return Promise.resolve(true); }
    };
    window.rewardedBreak = function() { return Promise.resolve(true); };
    window.commercialBreak = function() { return Promise.resolve(); };

    // Initialize loading screen background safely resolving relative to page origin
    (function() {
      var overlay = document.getElementById('nexus-loading-screen');
      if (overlay) {
        var bgUrl = 'Assets/loading_screen.png';
        try {
          var base = window.location.href.split('?')[0].split('#')[0];
          bgUrl = base.substring(0, base.lastIndexOf('/') + 1) + 'Assets/loading_screen.png';
        } catch(e) {}
        overlay.style.backgroundImage = "url('" + bgUrl + "')";
      }
    })();

    var nexusProgress = 0;
    var isNexusDone = false;
    var nexusBar = document.getElementById('nexus-loader-bar');
    var nexusOverlay = document.getElementById('nexus-loading-screen');
    var drawCount = 0;
    var activeFrames = 0;
    var isPostRunDone = false;
    var creepTimer = null;

    var busyTimer = setTimeout(function() {
      if (!isNexusDone && nexusBar) {
        nexusBar.classList.add('nexus-bar-busy');
      }
    }, 700);

    var creepStartTimer = setTimeout(function() {
      if (isNexusDone) return;
      creepTimer = setInterval(function() {
        if (isNexusDone) {
          clearInterval(creepTimer);
          return;
        }
        if (nexusProgress < 99) {
          var remaining = 99 - nexusProgress;
          var step = Math.max(0.1, remaining * 0.04);
          nexusProgress = Math.min(99, nexusProgress + step);
          if (nexusBar) nexusBar.style.width = nexusProgress + '%';
        }
      }, 100);
    }, 2000);

    function updateNexusProgress(pct) {
      if (isNexusDone || !nexusBar) return;
      nexusProgress = Math.max(nexusProgress, Math.min(99, pct));
      nexusBar.style.width = nexusProgress + '%';
    }

    function completeNexusLoading() {
      if (isNexusDone) return;
      isNexusDone = true;
      clearTimeout(busyTimer);
      clearTimeout(creepStartTimer);
      if (creepTimer) clearInterval(creepTimer);
      if (nexusBar) {
        nexusBar.style.transition = 'width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
        nexusBar.style.width = '100%';
      }
      var canvas = document.getElementById('canvas');
      if (canvas) canvas.style.visibility = 'visible';

      setTimeout(function() {
        if (nexusOverlay) {
          nexusOverlay.style.transition = 'opacity 0.4s ease';
          nexusOverlay.style.opacity = '0';
          nexusOverlay.style.pointerEvents = 'none';
          setTimeout(function() {
            if (nexusOverlay && nexusOverlay.parentNode) {
              nexusOverlay.parentNode.removeChild(nexusOverlay);
            }
            nexusOverlay = null;
            nexusBar = null;
          }, 450);
        }
      }, 120);
    }

    // Active canvas WebGL frame detector
    var lastDraws = 0;
    function checkBalatroRender() {
      if (isNexusDone) return;
      var canvas = document.getElementById('canvas');
      if (canvas && drawCount > lastDraws) {
        activeFrames++;
        updateNexusProgress(90 + Math.min(8, activeFrames * 2));
      }
      lastDraws = drawCount;

      if (isPostRunDone && activeFrames >= 3) {
        completeNexusLoading();
        return;
      }
      requestAnimationFrame(checkBalatroRender);
    }
    requestAnimationFrame(checkBalatroRender);

    // Prevent default scroll behavior for arrow keys & spacebar
    window.addEventListener("keydown", function (e) {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1 ||
          [32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Emscripten WASM runtime performance configuration
    var hasDependenciesStarted = false;
    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 134217728,
      print: function() {},
      printErr: function(msg) {
        if (msg && msg.indexOf && msg.indexOf("WebGL") !== -1) {
          console.warn("[Balatro WASM]", msg);
        }
      },
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener("webglcontextlost", function (e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);

        try {
          var origGetContext = canvas.getContext;
          canvas.getContext = function(type) {
            var ctx = origGetContext.apply(this, arguments);
            if (!ctx) return ctx;
            if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
              var oDA = ctx.drawArrays;
              if (oDA) ctx.drawArrays = function(m, f, count) { if (count > 0) drawCount++; return oDA.apply(this, arguments); };
              var oDE = ctx.drawElements;
              if (oDE) ctx.drawElements = function(m, count) { if (count > 0) drawCount++; return oDE.apply(this, arguments); };
            }
            return ctx;
          };
        } catch(e) {}

        return canvas;
      })(),
      setStatus: function (text) {
        if (text) {
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          if (m) {
            updateNexusProgress((parseFloat(m[2]) / parseFloat(m[4])) * 85);
          }
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function (left) {
        this.remainingDependencies = left;
        if (left > 0) hasDependenciesStarted = true;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (this.totalDependencies > 0) {
          var ratio = (this.totalDependencies - left) / this.totalDependencies;
          updateNexusProgress(ratio * 88);
        }
        if (left === 0 && hasDependenciesStarted) {
          updateNexusProgress(92);
        }
      },
      postRun: [
        function() {
          isPostRunDone = true;
          updateNexusProgress(96);
          setTimeout(function() {
            if (!isNexusDone) completeNexusLoading();
          }, 1500);
          // Periodic FS sync for Balatro save files
          setInterval(function() {
            try {
              if (window.FS && typeof FS.syncfs === 'function') {
                FS.syncfs(false, function() {});
              }
            } catch(e) {}
          }, 3000);
        }
      ]
    };

    updateNexusProgress(15);
    window.onerror = function (event) {
      setTimeout(completeNexusLoading, 1500);
    };

    var applicationLoad = function (e) {
      updateNexusProgress(90);
      try {
        Love(Module);
      } catch(err) {
        console.error("Love error:", err);
      }
      setTimeout(function() {
        if (!isNexusDone) completeNexusLoading();
      }, 16000);
    };

    // Universal Autosave Bridge for Balatro
    (function() {
      function sendSave() {
        try {
          var s = {};
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('tb_') !== 0) s[k] = localStorage.getItem(k);
          }
          var msg = { type: 'nexus-game-save', gameId: 'balatro', localStorage: s };
          if (window.parent && window.parent !== window) {
            try { window.parent.postMessage(msg, '*'); } catch(e) {}
          }
          var opener = (window.parent && window.parent.opener) || window.opener;
          if (opener) {
            try { opener.postMessage(msg, '*'); } catch(e) {}
          }
        } catch(e) {}
      }

      function syncAndSend() {
        try {
          if (window.FS && typeof FS.syncfs === 'function') {
            FS.syncfs(false, function() { sendSave(); });
            return;
          }
        } catch(e) {}
        sendSave();
      }

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'nexus-request-game-save') syncAndSend();
      });
      window.addEventListener('pagehide', syncAndSend, { passive: true });
      window.addEventListener('beforeunload', syncAndSend, { passive: true });
      setInterval(syncAndSend, 4000);
    })();
  </script>
  <script type="text/javascript" src="game.js?v=d7e34743-2fea-4de6-8a0e-1103b5fcf07f"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
</body>
</html>
