<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css?v=54">
    <script src="bgm-manager.js?v=55"></script>
    <script>
        (function() {
            const localStorage = window.nexusStorage;
            const theme = localStorage.getItem('tb_theme') || 'dark';
            if (theme === 'light') document.documentElement.classList.add('light-mode');
            if (localStorage.getItem('tb_performance_mode') === 'true') document.documentElement.classList.add('performance-mode');
        })();
    </script>
    <link rel="prefetch" href="site-core.js">
</head>
<body>
    <div id="page-fade-overlay"></div>
    <header>
        <div class="header-left-group" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0;">
            <h1 onclick="navigateWithFade('index.html')" style="margin: 0; cursor: pointer; white-space: nowrap;">Nexus Games</h1>
            <div id="game-status-container" class="status-header">
                <img id="game-status-icon" src="Assets/loadingRoll.gif" alt="" class="status-icon">
                <span id="game-status-text" class="status-text">Loading...</span>
            </div>
        </div>
		
        <div class="controls">
            <button id="cloak-btn" class="material-nav-btn" style="--expanded-width: 155px; display: none;">
                <img src="Assets/Fullscreen.svg" alt=""><span>Fullscreen</span>
            </button>
            <button id="export-btn" class="material-nav-btn btn-backup" style="--expanded-width: 125px;">
                <img src="Assets/Backup.svg" alt=""><span>Backup</span>
            </button>
            <button id="restore-btn" onclick="document.getElementById('import-btn').click()" class="material-nav-btn btn-restore" style="--expanded-width: 125px;">
                <span>Restore</span><img src="Assets/Restore.svg" alt="">
            </button>
            <button id="game-health-btn" class="material-nav-btn" style="--expanded-width: 112px;">
                <span>Health</span>
            </button>
            <input type="file" id="import-btn" accept=".json" style="display:none">
            <button id="custom-app-btn" class="material-nav-btn" style="--expanded-width: 124px;">
                <img src="Assets/Custom.svg" alt=""><span>Custom</span>
            </button>
            <button onclick="navigateWithFade('index.html')" class="material-nav-btn" style="--expanded-width: 104px;">
                <img src="Assets/media-back-arrow.svg" alt=""><span>Home</span>
            </button>
        </div>
    </header>
    <main>
        <aside class="sidebar">
            <ul id="game-list"></ul>
        </aside>
        <section class="game-container">
            <!-- The Zigzag Empty State -->
            <div id="empty-state" class="empty-state-bg">
                <h2 class="empty-state-title">Nothing Loaded.</h2>
                <p class="empty-state-subtitle">Click an app in the sidebar to get started</p>
            </div>
            
            <!-- Main Iframe -->
            <iframe id="game-frame" name="game-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock" allow="allow-storage-access-by-user-activation; storage-access; fullscreen"></iframe>
            
            <!-- Preloaded Stash Iframe -->
            <iframe id="stash-frame" name="stash-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock" allow="allow-storage-access-by-user-activation; storage-access; fullscreen" style="display: none; width: 100%; height: 100%; border: none;"></iframe>
        </section>
    </main>
    <!-- Custom App Overlay -->
    <div id="custom-app-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.88); z-index: 30000; align-items: center; justify-content: center;">
        <div style="background: var(--modal-bg); padding: 28px; border-radius: 24px; width: 460px; max-width: 90vw; border: 2px solid #2196F3; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.9);">
            <h2 style="color: #2196F3; margin-top: 0; margin-bottom: 16px; font-size: 24px;">Add Custom App</h2>

            <!-- Tab switcher -->
            <div id="custom-tab-row" style="display: flex; border-radius: 10px; overflow: hidden; margin-bottom: 20px; gap: 6px;">
                <button id="tab-file-btn" onclick="switchCustomTab('file')" style="flex:1; padding: 9px 0; background: #2196F3; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    <img src="Assets/uploadFile.svg" alt="" style="width:16px;height:16px;filter:invert(68%) sepia(33%) saturate(748%) hue-rotate(81deg) brightness(98%) contrast(91%);pointer-events:none;"> File
                </button>
                <button id="tab-url-btn" onclick="switchCustomTab('url')" style="flex:1; padding: 9px 0; background: transparent; color: #2196F3; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    <img id="tab-url-icon" src="Assets/addLink.svg" alt="" style="width:16px;height:16px;filter:brightness(0) invert(1);pointer-events:none;"> URL
                </button>
            </div>

            <input type="text" id="new-game-title" placeholder="App Title" style="width: 100%; padding: 12px; margin-bottom: 18px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 16px;">

            <!-- File panel -->
            <div id="custom-file-panel">
                <input type="file" id="new-game-file" accept=".html" style="width: 100%; margin-bottom: 18px; color: var(--text-color); background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); box-sizing: border-box;">
            </div>

            <!-- URL panel -->
            <div id="custom-url-panel" style="display:none; margin-bottom: 18px;">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="url" id="new-game-url" placeholder="https://example.com" style="flex:1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 15px; box-sizing: border-box;">
                    <button id="url-okay-btn" style="padding: 12px 18px; background: #2196F3; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: filter 0.15s;" onmouseenter="this.style.filter='brightness(1.2)'" onmouseleave="this.style.filter=''">Okay</button>
                </div>
                <div id="url-preview-badge" style="display:none; margin-top: 10px; padding: 8px 14px; background: rgba(33,150,243,0.12); border: 1px solid #2196F3; border-radius: 8px; font-size: 13px; color: #64b5f6; word-break: break-all; text-align: left;"></div>
            </div>

            <button id="add-game-btn" style="background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 999px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; transition: filter 0.2s;">Add App</button>
        </div>
    </div>

    <div id="rename-overlay" class="overlay">
        <div style="background: var(--modal-bg); padding: 28px; border-radius: 24px; width: 440px; max-width: 90vw; border: 2px solid #2196F3; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.9);">
            <h2 style="color: #2196F3; margin-top: 0; margin-bottom: 12px; font-size: 24px;">Rename App</h2>
            <input type="text" id="rename-app-title" class="rename-input" placeholder="App Title">
            <div id="rename-color-swatches" class="rename-color-swatches"></div>
            <button id="rename-done-btn" class="rename-done-btn">Done</button>
        </div>
    </div>

    <div id="backup-select-overlay" class="overlay" style="display:none; z-index:32000;">
        <div class="modal-box" style="max-width:560px; width:92vw; text-align:left;">
            <h2 id="backup-select-title" style="margin-top:0;">Select Games</h2>
            <p id="backup-select-hint" style="color:var(--muted-text,#999); font-size:13px;">Choose which games to include.</p>
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <button id="backup-select-all" class="action-btn" style="background:#2196F3;">Select All</button>
                <button id="backup-select-none" class="action-btn" style="background:#555;">Select None</button>
            </div>
            <div id="backup-game-list" style="max-height: fortyvh; max-height:40vh; overflow:auto; display:flex; flex-direction:column; gap:6px;"></div>
            <label style="display:flex; gap:8px; align-items:center; margin:14px 0; font-size:13px;"><input type="checkbox" id="backup-include-settings"> Include global settings</label>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button id="backup-select-cancel" class="action-btn" style="background:#555;">Cancel</button>
                <button id="backup-select-confirm" class="action-btn" style="background:#4CAF50;">Continue</button>
            </div>
        </div>
    </div>

    <script src="tutorial-engine.js?v=1"></script>
    <script src="game-title-utils.js?v=48"></script>
    <script src="app.js?v=49"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.TutorialEngine) TutorialEngine.initGames();
        });
    </script>
    <script>
        // ---- Custom tab logic ----
        let _customMode = 'file'; // 'file' or 'url'
        let _confirmedUrl = null;

        function switchCustomTab(mode) {
            _customMode = mode;
            _confirmedUrl = null;
            document.getElementById('url-preview-badge').style.display = 'none';
            document.getElementById('url-preview-badge').textContent = '';
            document.getElementById('new-game-url').value = '';

            const filePanel = document.getElementById('custom-file-panel');
            const urlPanel  = document.getElementById('custom-url-panel');
            const fileBtn   = document.getElementById('tab-file-btn');
            const urlBtn    = document.getElementById('tab-url-btn');
            const fileIcon  = fileBtn.querySelector('img');
            const urlIcon   = document.getElementById('tab-url-icon');

            if (mode === 'file') {
                filePanel.style.display = 'block';
                urlPanel.style.display  = 'none';
                fileBtn.style.background = '#2196F3';
                fileBtn.style.color = '#fff';
                urlBtn.style.background = 'transparent';
                urlBtn.style.color = '#2196F3';
                if (fileIcon) fileIcon.style.filter = 'invert(68%) sepia(33%) saturate(748%) hue-rotate(81deg) brightness(98%) contrast(91%)';
                if (urlIcon)  urlIcon.style.filter  = 'brightness(0) invert(1)';
            } else {
                filePanel.style.display = 'none';
                urlPanel.style.display  = 'block';
                urlBtn.style.background = '#2196F3';
                urlBtn.style.color = '#fff';
                fileBtn.style.background = 'transparent';
                fileBtn.style.color = '#2196F3';
                if (urlIcon)  urlIcon.style.filter  = 'invert(68%) sepia(33%) saturate(748%) hue-rotate(81deg) brightness(98%) contrast(91%)';
                if (fileIcon) fileIcon.style.filter = 'brightness(0) invert(1)';
                setTimeout(() => document.getElementById('new-game-url').focus(), 0);
            }
        }

        // Confirm the URL (shared by button click and auto-paste)
        function confirmUrl() {
            const raw = document.getElementById('new-game-url').value.trim();
            if (!raw) return;
            let url = raw;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            _confirmedUrl = url;
            const badge = document.getElementById('url-preview-badge');
            badge.textContent = '✔ ' + url;
            badge.style.display = 'block';
        }

        document.getElementById('url-okay-btn').addEventListener('click', confirmUrl);

        // Auto-confirm when a URL is pasted in
        document.getElementById('new-game-url').addEventListener('paste', () => {
            // Use setTimeout so the pasted value is in the input before we read it
            setTimeout(confirmUrl, 0);
        });

        document.getElementById('custom-app-btn').addEventListener('click', () => {
            // reset to file tab every open
            _customMode = 'file';
            _confirmedUrl = null;
            switchCustomTab('file');
            document.getElementById('new-game-title').value = '';
            document.getElementById('new-game-file').value = '';
            document.getElementById('url-preview-badge').style.display = 'none';
            document.getElementById('custom-app-overlay').style.display = 'flex';
            if (window.setGamePopupState) window.setGamePopupState('custom-app-overlay', true);
        });

        document.getElementById('add-game-btn').addEventListener('click', () => {
            const title = document.getElementById('new-game-title').value.trim();

            if (_customMode === 'url') {
                if (!title || !_confirmedUrl) {
                    if (!title) document.getElementById('new-game-title').focus();
                    else { nexusAlert && nexusAlert('Click "Okay" to confirm the URL first.'); }
                    return;
                }
                // Add URL game
                const newG = { id: 'custom_' + Date.now(), title, type: 'url', url: _confirmedUrl };
                const tx = db.transaction('customGames', 'readwrite');
                tx.objectStore('customGames').put(newG);
                tx.oncomplete = () => {
                    games.push(newG);
                    saveGameOrder();
                    renderGameList();
                };
                closeCustomOverlay();
            } else {
                // File mode — original logic via app.js handler fires separately
                setTimeout(() => {
                    const file = document.getElementById('new-game-file').files[0];
                    if (title && file) closeCustomOverlay();
                }, 50);
            }
        });

        function closeCustomOverlay() {
            document.getElementById('custom-app-overlay').style.display = 'none';
            document.getElementById('new-game-title').value = '';
            document.getElementById('new-game-file').value = '';
            document.getElementById('new-game-url').value = '';
            document.getElementById('url-preview-badge').style.display = 'none';
            _confirmedUrl = null;
            if (window.setGamePopupState) window.setGamePopupState('custom-app-overlay', false);
        }

        document.addEventListener('keydown', (e) => {
            const customOverlay = document.getElementById('custom-app-overlay');
            const renameOverlay = document.getElementById('rename-overlay');

            if (e.key === 'Escape') {
                if (customOverlay.style.display === 'flex') {
                    closeCustomOverlay();
                }
                if (renameOverlay && renameOverlay.style.display === 'flex') {
                    document.getElementById('rename-done-btn').dispatchEvent(new Event('rename-cancel'));
                }
            }

            if (e.key === 'Enter' && customOverlay.style.display === 'flex') {
                const focused = document.activeElement;
                // If focus is in the URL input, treat Enter as "Okay"
                if (focused && focused.id === 'new-game-url') {
                    e.preventDefault();
                    document.getElementById('url-okay-btn').click();
                    return;
                }
                e.preventDefault();
                document.getElementById('add-game-btn').click();
            }
        });

    </script>
    <script>
        (function() {
            const overlay = document.getElementById('page-fade-overlay');
            window.navigateWithFade = function(url) {
                if (overlay) {
                    overlay.classList.remove('fade-out');
                    setTimeout(() => { location.href = url; }, 370);
                } else {
                    location.href = url;
                }
            };
        })();
    </script>
</body>
</html>
